<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="REGNVM">
<meta name="theme-color" content="#EDE0C2">
<title>REGNVM — a game of succession</title>
<style>
  :root{
    --parch:#EDE0C2; --parchDeep:#E2D2AE; --parchCard:#F5EBD4; --parchDark:#D4C09A;
    --ink:#2C2317; --inkSoft:#6B5B44;
    --gold:#9C7A1C; --crimson:#8E2B2B; --forest:#3E6B4F; --blue:#2C4C7C; --edge:#B8A47C; --plum:#6B3A6E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:auto;overscroll-behavior-y:none;}
  body{background:radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.5),transparent 55%),
      radial-gradient(ellipse at 80% 80%,rgba(180,150,100,.25),transparent 60%),
      linear-gradient(160deg,#EFE4C8,#E4D3AE);background-attachment:fixed;color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:calc(14px + env(safe-area-inset-top)) 12px calc(64px + env(safe-area-inset-bottom));
    min-height:100dvh}
  #app{max-width:470px;margin:0 auto}
  .serif{font-family:ui-serif,Georgia,"Iowan Old Style",serif}
  h1{font-family:ui-serif,Georgia,serif;font-size:22px;letter-spacing:.22em;color:var(--crimson);font-weight:400}
  .hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:2px solid var(--edge);margin-bottom:6px}
  .tiny{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--inkSoft)}
  .sm{font-size:11.5px;color:var(--inkSoft)}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .panel{background:linear-gradient(150deg,var(--parchCard),var(--parchDeep));border:2px solid var(--edge);
    border-radius:4px;padding:14px;position:relative;box-shadow:0 2px 6px rgba(80,60,30,.18),inset 0 0 0 1px rgba(255,255,255,.4)}
  .zone{background:rgba(255,255,255,.35);border:1px solid var(--edge);border-radius:4px;padding:12px;margin-top:14px;
    box-shadow:inset 0 1px 4px rgba(140,115,70,.18)}
  .strip{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.3);
    border:1px solid var(--edge);border-radius:3px;padding:7px 11px;margin:10px 0}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
  .plate{display:block;width:100%;background:rgba(255,255,255,.42);border:1px solid var(--edge);
    border-radius:3px;padding:10px 12px;margin-top:7px;transition:background .12s}
  .plate > *{pointer-events:none}
  .plate:hover:not(:disabled){background:rgba(255,255,255,.72)}
  .plate:disabled{opacity:.42;cursor:default}
  .card{background:var(--parchCard);border-radius:3px;padding:9px 12px 9px 14px;margin-top:7px;position:relative;
    border:1px solid var(--edge);box-shadow:0 2px 5px rgba(80,60,30,.2)}
  .token{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:18px;font-weight:600;background:radial-gradient(circle at 35% 30%,#fff8e6,var(--parchDark));
    box-shadow:0 2px 4px rgba(80,60,30,.35),inset 0 -2px 4px rgba(140,115,70,.35)}
  .big{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;font-family:ui-serif,Georgia,serif}
  .cta{display:block;width:100%;text-align:center;padding:12px;border-radius:3px;font-family:ui-serif,Georgia,serif;
    font-size:17px;background:var(--crimson);color:#F6EDD8;margin-top:12px;box-shadow:0 2px 5px rgba(80,40,30,.35)}
  .deckwrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0;width:100%}
  .deck{position:relative;width:112px;height:140px}
  .deck > div{position:absolute;width:104px;height:132px;border-radius:4px;box-shadow:0 3px 8px rgba(80,60,30,.35)}
  .center{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .dice{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .modal{position:fixed;inset:0;background:rgba(50,38,20,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal .box{background:linear-gradient(150deg,#F7EFDA,#E9DBBB);border:2px solid var(--edge);border-radius:4px;
    padding:22px;max-width:370px;width:100%;box-shadow:0 10px 30px rgba(60,45,20,.4)}
  .modal p{font-size:14px;line-height:1.6;margin:10px 0 16px;color:var(--inkSoft)}
  .foot{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--inkSoft)}
  .foot button{text-decoration:underline}
  .scroll{max-height:230px;overflow-y:auto;background:rgba(255,255,255,.4);border:1px solid var(--edge);
    border-radius:3px;padding:10px;margin-top:8px;font-size:11.5px;line-height:1.65;color:var(--inkSoft)}
  .rule{height:1px;background:var(--edge);margin:12px 0;position:relative}
  .rule:after{content:"\2766";position:absolute;left:50%;top:-9px;transform:translateX(-50%);
    background:var(--parchCard);padding:0 8px;color:var(--gold);font-size:13px}
  .ledger div{display:flex;justify-content:space-between;font-size:11.5px;padding:1px 0}
  .pending{background:rgba(156,122,28,.14);border:1px dashed var(--gold);border-radius:3px;padding:6px 10px;margin-top:10px;font-size:11.5px}
  /* ---------- wide screens: the realm and the court side by side ---------- */
  .cols{display:block}
  @media (min-width:800px){
    body{padding:calc(20px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));font-size:17px}
    #app{max-width:1180px}
    .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
    .col-side{position:sticky;top:calc(16px + env(safe-area-inset-top))}
    h1{font-size:30px}
    .panel{padding:20px}
    .plate{padding:15px 18px;font-size:17px}
    .card{padding:13px 16px 13px 19px}
    .token{width:60px;height:60px;font-size:24px}
    .big{font-size:44px}
    .tiny{font-size:11px}
    .sm{font-size:14px}
    .cta{padding:17px;font-size:22px}
    .modal .box{max-width:560px;padding:30px}
    .modal p{font-size:17px}
    .scroll{max-height:420px;font-size:14px}
    .foot{gap:26px;font-size:14px;justify-content:center;padding-top:8px}
    .deck{width:150px;height:188px}
    .deck > div{width:140px;height:178px}
  }
  @media (min-width:1100px){
    #app{max-width:1320px}
    .cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px}
  }
  @keyframes dealIn{from{transform:translateY(-16px) rotate(-2.5deg) scale(.94);opacity:0}to{transform:none;opacity:1}}
  @keyframes tumble{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
  @keyframes settle{0%{transform:scale(1.15)}60%{transform:scale(.97)}100%{transform:scale(1)}}
  .deal{animation:dealIn .34s ease-out}.tumbling{animation:tumble .12s ease-in-out infinite alternate}.settled{animation:settle .3s ease-out}
</style>
</head>

andonar", "Pay now": "Pagar agora", "Forfeit an action": "Abrir mão de uma ação", "Negotiate": "Negociar", "Garrison the marches": "Guarnecer as marcas", "Pay 6 gold and gain 3 legacy. Costs no action.": "Pague 6 de ouro e ganhe 3 de legado. Não custa ação.", "Already collected this turn": "Já cobrado neste turno", "Not enough gold": "Ouro insuficiente", "Take one — a new work replaces it at once.": "Pegue uma — outra a substitui imediatamente.", "Deposit": "Depósito", "of your dynasty": "de sua dinastia", "work": "obra", "works": "obras", "Already": "Já", "works underway": "obras em andamento", "A work begun": "Uma obra iniciada", "Crisis": "Crise", "A good turn": "Um bom ano", "A favour owed": "Um favor devido", "Quiet": "Calmaria", "Shared fate": "Destino comum", "An offer": "Uma oferta", "Ruler": "Governante", "A work": "Uma obra", "Testament": "Promessa", "The reign ends. Name your successor.": "O reinado termina. Nomeie seu sucessor.", "You were cast out. The court raised the first claimant to hand; your heir begins at 3 support.": "Você foi deposto. A corte ergueu o primeiro pretendente à mão; seu herdeiro começa com 3 apoio.", "The Warlord is spent. Name your heir; they begin at 3 support.": "O Senhor da Guerra se esgotou. Nomeie seu herdeiro; ele começa com 3 apoio.", "The crown falls. Name your heir; they inherit": "A coroa cai. Nomeie seu herdeiro; ele herda", "support.": "apoio.", "Leave one testament.": "Deixe uma promessa.", "is judged on it when their reign ends.": "será julgado por ela quando seu reinado terminar.", "The testament they were bound by": "A promessa a que estavam presos", "honoured": "cumprida", "broken": "quebrada", "halved, they were cast out": "pela metade, foram depostos", "the Martyr's weight": "o peso do Mártir", "Any six": "Qualquer seis", "ends the reign.": "encerra o reinado.", "Every one": "Cada um", "costs a support.": "custa um apoio.", "has held the throne": "manteve o trono por", "No six.": "Nenhum seis.", "rules on.": "continua a reinar.", "ends it": "encerra", "−1 support": "−1 apoio", "a game of succession": "um jogo de sucessão", "How you win": "Como se vence", "The table": "A mesa", "Each opponent": "Cada oponente", "Two realms": "Dois reinos", "Three realms": "Três reinos", "Four realms": "Quatro reinos", "person": "pessoa", "steady": "firme", "ruthless": "impiedosa", "Begin the chronicle": "Começar a crônica", "Prototype": "Protótipo", "Short reign": "Reinado curto", "Full chronicle": "Crônica completa", "turns each": "turnos cada", "about 25 minutes": "cerca de 25 minutos", "about 50 minutes": "cerca de 50 minutos", "about 75 minutes": "cerca de 75 minutos", "The Red Court": "A Corte Vermelha", "The Blue Court": "A Corte Azul", "The Green Court": "A Corte Verde", "The Gold Court": "A Corte Dourada", "You": "Você", "chronicle": "crônica", "hide chronicle": "ocultar crônica", "rules": "regras", "hide rules": "ocultar regras", "court speed": "ritmo da corte", "pause": "pausar", "resume": "retomar", "slow": "lento", "measured": "pausado", "brisk": "rápido", "The final reckoning": "O acerto final", "is remembered": "é lembrado", "The realms are equal": "Os reinos estão empatados", "Begin again": "Começar de novo", "rulers": "governantes", "settled": "resolvidas", "quiet": "calmaria", "must answer": "deve responder", "You hold": "Você tem", "Crises settled": "Crises resolvidas", "Works completed": "Obras concluídas", "Songs and tribute": "Canções e tributos", "Testaments": "Promessas", "Crises refused": "Crises não resolvidas", "Depositions": "Deposições", "Usurpers": "Usurpadores", "Longest reign": "Reinado mais longo", "Rivals brought down": "Rivais derrubados", "Offers and shared fates": "Propostas e destinos comuns", "The longest reign of the age": "O reinado mais longo da era", "Every crisis still open at the end resolves against you.": "Toda crise ainda aberta ao final se resolve contra você.", "turns remain": "turnos restam", "place card here": "carta aqui", "current ruler": "governante atual", "Legacy is the only score.": "Legado é a única pontuação.", "A turn:": "Um turno:", "Actions": "Ações", "Works": "Obras", "The crown roll:": "A rolagem da coroa:", "Succession:": "Sucessão:", "Favours": "Favores", "The chronicle deck": "O baralho da crônica", "Declaring an action": "Declarar uma ação", "Rolling": "Rolar", "Collecting taxes": "Cobrar impostos", "The works deck": "O mercado de obras", "Settling early": "Resolver cedo", "Letting it run": "Deixar correr", "Naming a successor": "Nomear um sucessor", "The testament": "A promessa", "Every turn opens with a draw. Most cards are crises with a demand and a countdown, but the world sometimes gives instead of takes, and some turns nothing happens at all. You do not choose what arrives.": "Todo turno começa com uma compra. A maioria são crises, com uma exigência e uma contagem, mas às vezes o mundo dá em vez de tirar, e em alguns turnos nada acontece. Você não escolhe o que chega.", "You choose the action first and roll afterwards. You commit to a course before knowing how well it goes. Two actions a turn, and the second is chosen knowing how the first landed.": "Você escolhe a ação primeiro e rola depois. Você se compromete antes de saber como vai sair. Duas ações por turno, e a segunda é escolhida sabendo como a primeira acabou.", "The die decides the size of the result, not whether it works. Everything rounds down, so a poor roll on a halved action can come to nothing at all.": "O dado decide o tamanho do resultado, não se ele funciona. Tudo arredonda para baixo, então uma rolagem ruim numa ação reduzida pode não dar nada.", "Taxes may only be collected once a turn, and the gold does not arrive until the turn is over. It cannot pay a debt that comes due this same turn. Support, however, is spent the moment you give the order.": "Impostos só podem ser cobrados uma vez por turno, e o ouro só chega ao fim do turno. Ele não paga uma dívida que vence neste mesmo turno. O apoio, porém, é gasto no instante em que você dá a ordem.", "You can clear a crisis at any time by tapping its card. It costs no action. Waiting is cheaper now and more dangerous later, and the debt may not be yours by the time it comes due.": "Você pode resolver uma crise a qualquer momento tocando sua carta. Não custa ação. Esperar é mais barato agora e mais perigoso depois, e a dívida pode não ser sua quando vencer.", "Favours are held until spent and pass down to your successors. They cost no action.": "Favores ficam guardados até serem usados e passam aos seus sucessores. Não custam ação.", "You may choose not to pay. The crisis is then left unresolved, costing legacy and often support. Sometimes that is cheaper, especially when the debt was left to you.": "Você pode escolher não pagar. A crise fica sem resolver, custando legado e muitas vezes apoio. Às vezes sai mais barato, principalmente quando a dívida foi deixada para você.", "One die for every turn of your reign. Any six ends the reign, and every one costs a support. The longer you rule, the more of both you roll.": "Um dado para cada turno de seu reinado. Qualquer seis encerra o reinado, e cada um custa um apoio. Quanto mais você governa, mais de ambos você rola.", "Resources, works, debts and favours all carry over. Abilities do not. When the crown falls of its own accord you name your heir, and they inherit half the support you left, never less than 3.": "Recursos, obras, dívidas e favores passam adiante. Habilidades não. Quando a coroa cai por conta própria você nomeia seu herdeiro, e ele herda metade do apoio que você deixou, nunca menos que 3.", "You were deposed, so the choice is not yours. Two claimants are revealed and the die names one of them. Being cast out costs a legacy, leaves your heir at 3 support, and takes away your say in what follows.": "Você foi deposto, então a escolha não é sua. A corte ergue o primeiro pretendente à mão. Ser deposto custa um legado, deixa seu herdeiro com 3 apoio, e tira seu direito de escolher o que vem depois.", "Your last act binds your successor to one condition, judged when their own reign ends. It is the only way to reach past your own death.": "Seu último ato obriga seu sucessor a uma condição, julgada quando o reinado dele terminar. É a única forma de alcançar além da própria morte.", "Gained by settling crises, finishing works and honouring testaments. Lost by letting crises run, being deposed, and breaking the word left to you. At the end every open crisis resolves against you.": "Ganho ao resolver crises, concluir obras e cumprir promessas. Perdido ao deixar crises correrem, ser deposto e quebrar a palavra deixada a você. Ao final, toda crise aberta se resolve contra você.", "draw the chronicle, take two actions, settle what came due, roll the crown.": "compre a crônica, faça duas ações, resolva o que venceu, role a coroa.", "You can clear a crisis at any time by tapping its card. It costs no die. Waiting is cheaper now and more dangerous later, and the debt may not be yours by the time it comes due.": "Você pode resolver uma crise a qualquer momento tocando sua carta. Não custa dado. Esperar é mais barato agora e mais perigoso depois, e a dívida pode não ser sua quando vencer.", "Favours are held until spent and pass down to your successors. They cost no die.": "Favores ficam guardados até serem usados e passam aos seus sucessores. Não custam dado.", "Legacy this round": "Legado nesta rodada", "Continue": "Continuar", "total": "total", "the table": "a mesa", "Share this code. Everyone opens the same artifact and joins.": "Compartilhe este código. Todos abrem o mesmo artefato e entram.", "You are": "Você é", "you set the table": "você comanda a mesa", "Realms seated": "Reinos à mesa", "Waiting for the host to begin…": "Aguardando o anfitrião começar…", "Play across devices": "Jogar entre dispositivos", "Open a table": "Abrir uma mesa", "Join": "Entrar", "No table with that code.": "Nenhuma mesa com esse código.", "Online play is not available here.": "Jogo online indisponível aqui.", "The table could not be reached.": "Não foi possível alcançar a mesa.", "Your move": "Sua vez", "Waiting for": "Aguardando", "table": "mesa", "others join from their own device": "os outros entram pelo próprio aparelho", "Find a table": "Procurar uma mesa", "Looking…": "Procurando…", "seated": "sentado", "No open tables just now.": "Nenhuma mesa aberta agora.", "That table has already begun.": "Essa mesa já começou.", "That table is full.": "Essa mesa está cheia.", "here": "presente", "empty": "vazio", "Enter a table code": "Digite o código da mesa", "Check connection": "Verificar conexão", "Connection check": "Verificação de conexão", "build": "versão", "host": "anfitrião", "you": "você", "Everyone must open this same link. An older link is a different table.": "Todos precisam abrir este mesmo link. Um link antigo é outra mesa.", "Share this link, then this code.": "Compartilhe este link e depois este código.", "Different versions. Both must open the same link.": "Versões diferentes. Os dois precisam abrir o mesmo link.", "No shared table here": "Sem mesa compartilhada aqui", "Playing across devices needs the published link. Tap the ••• menu above, choose Publish, then open that link yourself and send it to the others. Everyone must be on the published link, not this preview.": "Jogar entre dispositivos exige o link publicado. Toque no menu ••• acima, escolha Publicar, abra esse link você mesmo e envie aos outros. Todos precisam estar no link publicado, não nesta prévia.", "Who do you approach?": "A quem você se dirige?", "Take it up": "Pegar a carta", "Hold a Feast": "Dar um Banquete", "Support equal to half the die. Spend 4 grain to make it a great feast and take the full die.": "Apoio igual à metade do dado. Gaste 4 grão para fazer um grande banquete e usar o dado inteiro.", "How grand a feast?": "Quão grandioso será o banquete?", "A modest feast": "Um banquete modesto", "Half the die in support. Costs nothing.": "Metade do dado em apoio. Não custa nada.", "A great feast": "Um grande banquete", "4 grain. The full die in support, and it can never come to nothing.": "4 grão. O dado inteiro em apoio, e nunca dá em nada.", "His feasts are always great, and cost no grain": "Seus banquetes são sempre grandiosos, e não custam grão", "His feasts gain only 1, whatever the die": "Seus banquetes rendem apenas 1, seja qual for o dado", "always a great feast, free": "sempre um grande banquete, de graça", "So it is written": "Assim está escrito", "As fate would have it": "Como quis o destino", "It must be borne": "É preciso suportar", "The realm will answer": "O reino responderá", "So be it": "Que assim seja", "Then let it come": "Que venha, então", "The chronicler notes it": "O cronista anota", "A kindness, then": "Uma gentileza, então", "Gratefully": "Com gratidão", "The year is good": "O ano é bom", "Small mercies": "Pequenas graças", "Kept in reserve": "Guardado de reserva", "It will be remembered": "Será lembrado", "Held against the day": "Guardado para a hora certa", "Noted, and kept": "Anotado, e guardado", "Little to record": "Pouco a registrar", "A quiet year": "Um ano calmo", "So the page turns": "E a página vira", "Nothing to answer": "Nada a responder", "Let it be heard": "Que se ouça", "Word goes out": "A notícia corre", "It touches every realm": "Atinge todos os reinos", "So it falls to all": "Cabe a todos, então", "Let it be put to them": "Que se proponha a eles", "We shall see what they say": "Veremos o que dirão", "The granaries were full when he took the throne.": "Os celeiros estavam cheios quando ele assumiu o trono.", "They have not left. That is the worrying part.": "Eles não foram embora. Essa é a parte preocupante.", "They preach outside the walls, and the guards listen.": "Pregam fora dos muros, e os guardas escutam.", "They flew no flag anyone recognised.": "Não içavam bandeira que alguém reconhecesse.", "Small losses, often, in places nobody visits.": "Perdas pequenas, frequentes, em lugares que ninguém visita.", "Rain in the wrong month, and nobody at fault.": "Chuva no mês errado, e ninguém é culpado.", "Everything still moves, but slowly, and at a price.": "Tudo ainda se move, mas devagar, e a um preço.", "Without it the winter meat will not keep.": "Sem ele a carne do inverno não se conserva.", "It began in a bakehouse, as these things do.": "Começou numa padaria, como essas coisas começam.", "Someone has been shaving the coin for years.": "Alguém vem raspando as moedas há anos.", "The question is asked quietly, then less quietly.": "A pergunta é feita baixinho, depois nem tanto.", "Justice delayed is remembered longer than justice done.": "Justiça adiada é lembrada mais tempo que justiça feita.", "Men must be counted, fed, and shown a banner.": "Homens precisam ser contados, alimentados e ver um estandarte.", "It has been performed every year since anyone can remember.": "É celebrado todo ano desde que alguém se lembra.", "A ruler unseen is a ruler half believed in.": "Governante que não se vê é governante em que só se acredita pela metade.", "Bread or coin; the queue does not care which.": "Pão ou moeda; a fila não faz questão.", "Lead or labour. The rain is not patient.": "Chumbo ou trabalho. A chuva não tem paciência.", "Pay them off, or feed the men who clear them out.": "Pague a eles, ou alimente os homens que os expulsarão.", "They ask for grain. They would settle for being heard.": "Pedem grão. Aceitariam apenas ser ouvidas.", "Lombards are courteous, and they keep excellent records.": "Os lombardos são corteses, e mantêm registros excelentes.", "Coin, bread, or a reason. Any of the three will do.": "Moeda, pão ou um motivo. Qualquer um dos três serve.", "A season's work, gone in a night.": "O trabalho de uma estação, perdido numa noite.", "They have grievances, and they have time.": "Têm queixas, e têm tempo.", "He kept the whole of it in his head.": "Ele guardava a obra inteira na cabeça.", "Bought cheap, from a merchant nobody can now find.": "Compradas barato, de um mercador que ninguém mais acha.", "A boy with a claim and somebody else's army.": "Um menino com uma reivindicação e o exército de outro.", "They want it in writing, and they want it now.": "Querem por escrito, e querem agora.", "A raven in the nave. Everyone saw it.": "Um corvo na nave. Todos viram.", "The Church asks according to what it sees.": "A Igreja pede conforme o que vê.", "Prosperity is noticed.": "A prosperidade chama atenção.", "The door stays open longer than usual.": "A porta fica aberta mais tempo que o normal.", "He has been wrong before. Not often.": "Ele já errou antes. Não com frequência.", "Someone had the sense to bury it.": "Alguém teve o bom senso de enterrar.", "They were never asked why they stayed.": "Nunca lhes perguntaram por que ficaram.", "Loyal for exactly as long as they are paid.": "Leais exatamente enquanto forem pagos.", "He served the father. He will serve the son.": "Serviu ao pai. Servirá ao filho.", "Nothing unites like a shared border.": "Nada une como uma fronteira em comum.", "Everyone agrees it must be done.": "Todos concordam que precisa ser feito.", "Hunger does not check whose land it is on.": "A fome não pergunta de quem é a terra.", "The honour is expensive.": "A honra sai cara.", "Sworn on relics, which helps.": "Jurada sobre relíquias, o que ajuda.", "He has come a long way, and he has noticed who is richest.": "Veio de longe, e reparou quem é o mais rico.", "A daughter, a treaty, and a great deal of grain.": "Uma filha, um tratado e muito grão.", "He is comfortable. He is also expensive.": "Ele está confortável. Também está caro.", "The loan was a favour. This is not.": "O empréstimo foi um favor. Isto não é.", "It would help both of you. That is the problem.": "Ajudaria os dois. Esse é o problema.", "Someone else's trouble, taken willingly.": "O problema de outro, assumido de bom grado.", "Nothing happens.": "Nada acontece.", "Gain": "Ganhe", "due in": "vence em", "first turn": "primeiro turno", "skip the walkthrough": "pular a explicação", "Next": "Seguir", "Your ruler": "Seu governante", "This is who sits the throne right now. Their one strength and one weakness are printed just below. When they die the next ruler will have different ones — nothing about them carries over.": "É quem ocupa o trono agora. A força e a fraqueza dele estão logo abaixo. Quando morrer, o próximo terá outras — nada disso passa adiante.", "Legacy": "Legado", "The only score there is, and how the game is won. You gain it by settling crises, finishing works and keeping the promises left to you — and it never falls below zero, however badly things go. Whoever has the most when the chronicle closes wins.": "A única pontuação que existe, e é assim que se vence. Você ganha resolvendo crises, concluindo obras e cumprindo as promessas deixadas a você — e ela nunca cai abaixo de zero, por pior que as coisas fiquem. Quem tiver mais quando a crônica se encerrar vence.", "What the realm holds": "O que o reino tem", "Gold and grain pay for crises and for works. Support is different: it is also your ruler’s life. If it reaches zero they are thrown out.": "Ouro e grão pagam crises e obras. O apoio é diferente: é também a vida do seu governante. Se chegar a zero, ele é deposto.", "The reign": "O reinado", "One die for every turn your ruler has survived. You will roll them all at the end of the turn, and the pile only grows.": "Um dado para cada turno que seu governante sobreviveu. Você rola todos no fim do turno, e o monte só cresce.", "The chronicle": "A crônica", "Every turn opens here. Draw a card and the world does something to you — usually a crisis, sometimes a kindness. Go ahead and draw.": "Todo turno começa aqui. Compre uma carta e o mundo faz algo com você — geralmente uma crise, às vezes uma gentileza. Pode comprar.", "The card": "A carta", "What it demands is in bold. How long you have is in the corner. A crisis will sit in front of you and count down one turn at a time until you pay it or refuse it.": "O que ela exige está em negrito. Quanto tempo você tem está no canto. Uma crise fica à sua frente e conta os turnos até você pagá-la ou recusá-la.", "Grain equal to the die, at once. Grain pays crises and buys a great feast.": "Grão igual ao dado, na hora. Grão paga crises e compra um grande banquete.", "Collect taxes": "Cobrar impostos", "Gold equal to the die — but it only reaches the treasury at the end of your turn, so it cannot pay a debt due today. And it costs a support every time.": "Ouro igual ao dado — mas só chega ao tesouro no fim do turno, então não paga uma dívida que vence hoje. E custa um apoio toda vez.", "Hold a feast": "Dar um banquete", "The only way to buy support back. Half the die for nothing, or spend 4 grain for the full die.": "A única forma de recuperar apoio. Metade do dado de graça, ou 4 grão para o dado inteiro.", "No die at all. Pay a small deposit and take a work from the market. Its real cost falls due when it is finished — very often on a ruler who is not you.": "Sem dado. Pague um pequeno depósito e pegue uma obra do mercado. O custo real vence quando ela é concluída — muitas vezes sobre outro governante.", "The promise": "A promessa", "Your last act binds your heir to one condition, judged when THEIR reign ends. Choose one they can actually keep, not one you would have liked. A promise is void if that reign lasts two turns or less, or if the heir is cast out — and none is made at all when the age has two turns left.": "Seu último ato obriga seu herdeiro a uma condição, julgada quando o reinado DELE terminar. Escolha uma que ele consiga cumprir, não a que você gostaria. A promessa é anulada se esse reinado durar dois turnos ou menos, ou se o herdeiro for deposto — e nenhuma é feita quando restam dois turnos de era.", "Everything you owe lives here, in front of you, counting down. Crises and half-built works share the same space. You can settle a crisis early at any time by tapping it — it costs no action.": "Tudo o que você deve fica aqui, à sua frente, em contagem regressiva. Crises e obras pela metade dividem o mesmo espaço. Você pode resolver uma crise a qualquer momento tocando nela — não custa ação.", "A favour sits beside your realm until you spend it, and it costs no action. It passes to your heirs, so one kept now may save a ruler you have not met yet.": "Um favor fica ao lado do seu reino até ser usado, e não custa ação. Ele passa aos herdeiros, então guardar um agora pode salvar um governante que você ainda nem conheceu.", "The promise you inherited": "A promessa que você herdou", "This is what your predecessor bound you to. The mark on the right tells you whether it is being kept right now. It is judged the moment this reign ends — honoured, it pays; broken, it costs.": "É a isto que seu antecessor o obrigou. A marca à direita diz se está sendo cumprida agora. Ela é julgada no instante em que este reinado terminar — cumprida, rende; quebrada, custa.", "What it holds": "O que ela guarda", "a demand with a deadline — half the deck": "uma exigência com prazo — metade do baralho", "a gift, taken at once": "um presente, recebido na hora", "kept until you spend it, and inherited": "guardado até ser usado, e herdado", "falls on every realm at once": "cai sobre todos os reinos ao mesmo tempo", "put to a rival, who decides": "proposta a um rival, que decide", "nothing happens at all": "não acontece nada", "Your two actions": "Suas duas ações", "Two a turn, and no more. You declare what you are doing first and roll afterwards — so you are committing to a course before you know how well it goes. The second is chosen knowing how the first landed.": "Duas por turno, e não mais. Você declara o que vai fazer primeiro e rola o dado depois — ou seja, se compromete antes de saber como vai sair. A segunda é escolhida já sabendo como foi a primeira.", "Delay it": "Adiar", "2 more turns · −2 legacy": "mais 2 turnos · −2 de legado", "If you cannot, the masons will wait — but a late work is remembered as a lesser one.": "Se não puder, os pedreiros esperam — mas uma obra atrasada é lembrada como algo menor.", "No die at all. Pay a small deposit and take a work from the market. Its real cost falls due when it is finished — very often on one of your heirs rather than on you.": "Sem dado. Pague um pequeno depósito e pegue uma obra do mercado. O custo real vence quando ela é concluída — muitas vezes sobre um de seus herdeiros, e não sobre você.", "the crown falls": "a coroa cai", "Never fell below zero": "Nunca caiu abaixo de zero", "Leave no crisis unresolved": "Não deixe nenhuma crise sem resolver", "already set back": "já atrasada", "turns left": "turnos restantes", "A promise made too late to be kept or broken": "Uma promessa feita tarde demais para ser cumprida ou quebrada", "A rival may pay the drawing realm 4 gold. Refused, that rival loses 2 support.": "Um rival pode pagar 4 ouro ao reino que comprou a carta. Recusando, esse rival perde 2 de apoio.", "A rival hands the drawing realm 3 of a resource of their choosing, or the drawing realm gains 2 legacy.": "Um rival entrega 3 de um recurso à sua escolha ao reino que comprou a carta, ou esse reino ganha 2 de legado.", "A rival may take the drawing realm's worst crisis onto their own board, and gains 3 legacy for it.": "Um rival pode assumir a pior crise do reino que comprou a carta, e ganha 3 de legado por isso.", "You pay 4 gold": "Você paga 4 ouro", "You lose 2 support": "Você perde 2 de apoio", "You give 3 grain": "Você dá 3 grão", "You give 3 gold": "Você dá 3 ouro", "They gain 2 legacy": "Eles ganham 2 de legado", "You pay 2 gold · if both pay, both gain 3 legacy": "Você paga 2 ouro · se ambos pagarem, ambos ganham 3 de legado", "If they pay alone, you lose 1 legacy": "Se eles pagarem sozinhos, você perde 1 de legado", "You take their crisis and gain 3 legacy": "Você assume a crise deles e ganha 3 de legado", "Nothing changes": "Nada muda", "Both give 3 grain and gain 2 legacy": "Ambos dão 3 grão e ganham 2 de legado", "Both lose 3 legacy and 2 support": "Ambos perdem 3 de legado e 2 de apoio", "You gain 3 gold and the crisis": "Você ganha 3 ouro e a crise", "It stays with them": "Fica com eles", "Both gain 2 legacy · breaking it costs 4": "Ambos ganham 2 de legado · romper custa 4", "No truce is made": "Nenhuma trégua é feita", "You pay 2 gold to every other realm": "Você paga 2 ouro a cada outro reino", "You lose 3 legacy": "Você perde 3 de legado", "This view cannot reach the shared store, so play across devices is unavailable. Everything else works — the game plays locally against the courts.": "Esta visualização não alcança o armazenamento compartilhado, então jogar entre dispositivos está indisponível. Todo o resto funciona — o jogo roda localmente contra as cortes.", "Reaching the table…": "Alcançando a mesa…", "the table is live and visible": "a mesa está ativa e visível", "not saved": "não foi salva", "saving…": "salvando…", "no document at rooms/": "nenhum documento em rooms/", "tables you can see": "mesas que você enxerga", "none": "nenhuma", "Your colours": "Suas cores", "You play as": "Você joga como", "The Violet Court": "A Corte Violeta", "The Slate Court": "A Corte Ardósia", "The Rust Court": "A Corte Ferrugem", "The Moss Court": "A Corte Musgo", "promised, not yet come": "prometido, ainda por vir", "pays 4 legacy at the end of your next reign": "paga 4 de legado ao fim do seu próximo reinado", "one more legacy when this reign ends": "mais 1 de legado quando este reinado terminar", "your heir rules as this ruler for one turn": "seu herdeiro governa como este governante por um turno", "in force this turn": "em vigor neste turno", "one six will be ignored": "um seis será ignorado", "the next Disrupt against you is turned aside": "a próxima Sabotagem contra você é desviada", "A respite": "Um alívio", "your next crisis arrives a turn later": "sua próxima crise chega um turno depois", "Take it for 2 gold": "Assumir por 2 ouro", "Different versions.": "Versões diferentes.", "close this page and open the link again; a browser will keep serving the old copy.": "feche esta página e abra o link de novo; o navegador continua servindo a cópia antiga.", "Count": "Conde", "Duke": "Duque", "King": "Rei", "nothing": "nada", "TURNS": "TURNOS", " on completion": " na conclusão", "The works market. Take one — a new work replaces it at once.": "O mercado de obras. Pegue uma — outra a substitui na hora.", "4 legacy at the end of your next reign — but nothing at all if that ruler is deposed for want of support.": "4 de legado ao fim do seu próximo reinado — mas nada se esse governante for deposto por falta de apoio.", "4 legacy at the end of your next reign — lost if that ruler is deposed": "4 de legado ao fim do seu próximo reinado — perdido se esse governante for deposto", "Needs": "Precisa de", "You and one rival must find 3 grain each. Both pay: both gain 2 legacy. Either refuses: both lose 3 legacy and 2 support.": "Você e um rival devem achar 3 grão cada. Ambos pagando: ambos ganham 2 de legado. Se um recusar: ambos perdem 3 de legado e 2 de apoio.", "die + 2 gold": "dado + 2 ouro", "die + 2 grain": "dado + 2 grão", "half the die": "metade do dado", "the full die": "o dado inteiro", "gains only 1": "rende apenas 1", "only one work at a time": "só uma obra por vez", "in": "em", "Whoever leads on legacy chooses: lose 3 legacy, or give every other realm 2 gold.": "Quem lidera em legado escolhe: perder 3 de legado, ou dar 2 de ouro a cada outro reino.", "costs 2 support": "custa 2 de apoio", "6 gold. Any realm may pay and gain 3 legacy. If none has paid by your next turn, every realm loses 3 legacy.": "6 de ouro. Qualquer reino pode pagar e ganhar 3 de legado. Se ninguém pagar até seu próximo turno, todos os reinos perdem 3 de legado.", "costs nothing": "não custa nada", "only 1 support": "apenas 1 de apoio", "works begun now pay 2 less legacy": "obras iniciadas agora rendem 2 de legado a menos", "A work will be harmed.": "Uma obra será prejudicada.", "The crown roll will suffer.": "A rolagem da coroa sofrerá.", "2 extra legacy, three works allowed": "2 de legado a mais, até três obras", "6 gold. Any realm may pay and gain 3 legacy. If none has paid by your next turn, every realm loses 3.": "6 de ouro. Qualquer reino pode pagar e ganhar 3 de legado. Se ninguém pagar até seu próximo turno, todos os reinos perdem 3 de legado.", "No work stood to be harmed.": "Nenhuma obra havia para ser prejudicada.", "Offer a rival a truce. Both gain 2 legacy now. Whoever Disrupts the other first loses 4.": "Ofereça uma trégua a um rival. Ambos ganham 2 de legado agora. Quem sabotar o outro primeiro perde 4.", "Worth 5 legacy at the end, until someone rules longer.": "Vale 5 de legado no fim, até alguém reinar por mais tempo.", "left unfinished": "deixada inacabada", "left unsettled": "deixada sem resolver", "void — the reign was cast out": "anulada — o reinado foi deposto", "for the fallen": "pelos caídos", " or ": " ou ", "or": "ou", "action": "ação", "either": "ou isto ou aquilo", "position": "posição", "The court acts": "A corte age", "The two ways a reign ends": "As duas formas de um reinado terminar", "Both end a reign. They are not the same thing at all.": "As duas encerram um reinado. E não são nada parecidas.", "The crown falls — a six": "A coroa cai — um seis", "Cast out — support reaches zero": "Deposto — o apoio chega a zero", "Your heir": "Seu herdeiro", "They begin with": "Ele começa com", "Your promise": "Sua promessa", "Your works": "Suas obras", "And": "E ainda", "you choose between two claimants": "você escolhe entre dois pretendentes", "half your support, never under 3": "metade do seu apoio, nunca menos de 3", "judged — honoured pays, broken costs": "julgada — cumprida rende, quebrada custa", "carry on untouched": "seguem intactas", "the court raises the first claimant. No choice.": "a corte ergue o primeiro pretendente. Sem escolha.", "3 support": "3 de apoio", "void. Neither kept nor broken — a promise you were about to honour pays nothing": "anulada. Nem cumprida nem quebrada — uma promessa que você estava prestes a cumprir não rende nada", "each loses 1 legacy": "cada uma perde 1 de legado", "−1 legacy outright, and A Long Peace pays nothing": "−1 de legado direto, e A Longa Paz não paga nada", "So support is not a resource like the others. Running it to nothing does not cost you a turn — it costs you the reign, the promise and part of every work in progress.": "Ou seja: apoio não é um recurso como os outros. Zerá-lo não custa um turno — custa o reinado, a promessa e parte de cada obra em andamento.", "The card panel": "O painel de cartas", "Everything material passes on: gold, grain, debts, half-built works, unspent favours. Your ruler’s abilities do not.": "Tudo o que é material passa adiante: ouro, grão, dívidas, obras pela metade, favores guardados. As habilidades do governante, não.", "Choose who inherits the mess — two claimants are revealed, and the one you pass over returns to the bottom of the court.": "Escolha quem herda a bagunça — dois pretendentes são revelados, e o preterido volta para o fundo da corte.", "You were cast out.": "Você foi deposto.", "Support reached zero, so there is no choice to make: the court raises the first claimant to hand, and they begin at three support whatever you had left.": "O apoio chegou a zero, então não há escolha: a corte ergue o primeiro pretendente à mão, e ele começa com três de apoio.", "There is more to this, and it is worth knowing — I will lay the two endings side by side shortly.": "Há mais sobre isso, e vale saber — vou comparar os dois finais lado a lado em breve.", "Each of the two realms may give 3 grain. Giving costs nothing more; refusing costs 2 legacy. If both give, both gain 2 legacy — the relief only works if neither side hoards.": "Cada um dos dois reinos pode dar 3 de grão. Dar não custa mais nada; recusar custa 2 de legado. Se ambos derem, ambos ganham 2 de legado — o socorro só funciona se nenhum lado guardar para si.", "You give 3 grain · if both give, both gain 2 legacy": "Você dá 3 de grão · se ambos derem, ambos ganham 2 de legado", "You lose 2 legacy": "Você perde 2 de legado", "Welcome to REGNVM": "Bem-vindo a REGNVM", "a game of legacy and succession": "um jogo de legado e sucessão", "Whether or not you have played before, this first turn walks through how the game works and what to watch. It is a turn apart: nothing in it is counted, and the chronicle proper begins once it is done.": "Tendo jogado antes ou não, este primeiro turno explica como o jogo funciona e o que observar. É um turno à parte: nada nele conta, e a crônica de verdade começa quando ele terminar.", "You may skip it at any point — every explanation lives in the Rules menu as well.": "Você pode pular a qualquer momento — todas as explicações também estão no menu Regras.", "Good fortune.": "Boa sorte.", "skip the walkthrough and begin": "pular a explicação e começar", "the walkthrough ends": "fim da explicação", "That is everything. This turn is now swept away and the chronicle begins in earnest — a fresh line, a fresh court, nothing carried over.": "É isso. Este turno é agora varrido e a crônica começa de verdade — uma nova linhagem, uma nova corte, nada aproveitado.", "All of it can be read again at any time under Rules.": "Tudo isso pode ser relido a qualquer momento em Regras.", "Count and Duke play by your rules. A King plays better and is better served: its harvests bring 1 extra grain, its taxes 1 extra gold, and every work it finishes pays 1 extra legacy.": "Conde e Duque jogam pelas suas regras. Um Rei joga melhor e é melhor servido: suas colheitas rendem 1 grão a mais, seus impostos 1 ouro a mais, e cada obra concluída paga 1 de legado a mais.", "You rolled a six.": "Você rolou um seis.", "The crown falls, and the reign is over however well it was going.": "A coroa cai, e o reinado acaba por melhor que estivesse indo.", "A crisis of 4 gold within 3 turns. The drawing realm keeps the burial, or pays a rival 2 gold to take it on — and with it whatever legacy settling it pays.": "Uma crise de 4 ouro em até 3 turnos. O reino que comprou fica com o enterro, ou paga 2 de ouro a um rival para assumi-lo — e com ele o legado de resolvê-lo.", "You gain 2 gold and a 4 gold crisis · settling it pays legacy": "Você ganha 2 ouro e uma crise de 4 ouro · resolvê-la rende legado", "The drawing realm offers 3 grain to a rival of its choosing. Accepted, the suitor gains 3 legacy and the rival takes the grain and 2 legacy. Refused, the rival loses 1 support and the slight costs the suitor 1 legacy.": "O reino que comprou a carta oferece 3 de grão a um rival de sua escolha. Aceito, o pretendente ganha 3 de legado e o rival fica com o grão e 2 de legado. Recusado, o rival perde 1 de apoio e o desfeite custa 1 de legado ao pretendente.", "You take 3 grain and 2 legacy · they gain 3 legacy": "Você fica com 3 de grão e 2 de legado · eles ganham 3 de legado", "You lose 1 support · they lose 1 legacy": "Você perde 1 de apoio · eles perdem 1 de legado", "It pays 1 less legacy now.": "Agora rende 1 de legado a menos.", "The blow is spoken of. +1 legacy.": "O golpe é comentado. +1 de legado.", "The Marshal": "O Marechal", "The Schemer": "O Intrigante", "The Patron": "O Patrono", "The Bastard": "O Bastardo", "Taxed gold reaches the treasury at once": "O ouro dos impostos chega ao tesouro na hora", "Collecting taxes costs 2 support": "Cobrar impostos custa 2 de apoio", "Ones on the crown roll cost nothing": "Os uns da rolagem da coroa não custam nada", "Harvest yields 2 less grain": "A colheita rende 2 grão a menos", "Chooses which claimant takes a rival's throne": "Escolhe qual pretendente assume o trono de um rival", "His own heir is always the court's choice": "Seu próprio herdeiro é sempre escolha da corte", "Settling a crisis also gains 1 support": "Resolver uma crise também rende 1 de apoio", "Taxes yield 2 less gold": "Os impostos rendem 2 ouro a menos", "Refusing a crisis costs him 1 less legacy": "Recusar uma crise lhe custa 1 de legado a menos", "Begins every reign with The Question of His Birth": "Começa todo reinado com A Questão de Seu Nascimento", "The Question of His Birth": "A Questão de Seu Nascimento", "By what right, they ask, and they ask loudly.": "Com que direito, perguntam, e perguntam alto.", "Gains 1 legacy whenever a rival finishes a work": "Ganha 1 de legado sempre que um rival conclui uma obra", "His own works pay 1 less legacy": "Suas próprias obras rendem 1 de legado a menos", "May settle any crisis with 2 support": "Pode resolver qualquer crise com 2 de apoio", "Works he begins pay 1 less legacy": "As obras que ele inicia rendem 1 de legado a menos", "Crises arrive one turn later than printed": "As crises chegam um turno depois do impresso", "Draws two cards, keeps one and leaves the other for a rival": "Compra duas cartas, fica com uma e deixa a outra para um rival", "the other year": "o outro ano", "Who lives through this one?": "Quem vive este aqui?", "Two years are foretold. Keep one; the other you leave to a rival.": "Dois anos são previstos. Fique com um; o outro você deixa para um rival.", "The Schemer's word": "A palavra do Intrigante", "Every realm rules through a line of mortal rulers, drawn two at a time from one shared court as the crown passes. You inherit what the last ruler left you, including their debts — and you cannot do what they could do.": "Cada reino governa através de uma linhagem de governantes mortais, revelados dois a dois de uma corte compartilhada a cada troca de coroa. Você herda o que o último governante deixou, dívidas inclusive — e não sabe fazer o que ele fazia.", "Legacy is the only score, and it never falls below zero. Gained by settling crises, finishing works and honouring the promises left to you. Lost by letting crises run, by being cast out, and by breaking your word. At the close, every debt still open resolves against you.": "Legado é a única pontuação, e nunca cai abaixo de zero. Ganho ao resolver crises, concluir obras e cumprir as promessas deixadas a você. Perdido ao deixar crises correrem, ao ser deposto e ao quebrar sua palavra. No fim, toda dívida ainda aberta se resolve contra você.", "Two": "Dois", "Three": "Três", "Four": "Quatro", "The crown falls — a six CROWN": "A coroa cai — um seis CROWN", "The Pilgrim": "O Peregrino", "The Treasurer": "O Tesoureiro", "works pay 1 less legacy": "obras rendem 1 de legado a menos", "the gold arrives at once, but costs 2 support": "o ouro chega na hora, mas custa 2 de apoio", "2 less gold": "2 ouro a menos", "2 less grain": "2 grão a menos", "Gold equal to the die, but only at the turn's end. Once a turn, and it costs 1 support.": "Ouro igual ao dado, mas só ao fim do turno. Uma vez por turno, e custa 1 de apoio.", "Strike at a rival's court, their works, or their debts. Costs 2 gold.": "Ataque a corte, as obras ou as dívidas de um rival. Custa 2 de ouro.", "The last act of every turn is the crown roll. Any 6 CROWN ends the reign. Every 1 ONE costs 1 support. The longer you last, the more dice you throw.": "O último ato de todo turno é a rolagem da coroa. Qualquer 6 CROWN encerra o reinado. Cada 1 ONE custa 1 de apoio. Quanto mais você dura, mais dados rola.", "Building never rolls. Take one of the three works on offer; another replaces it at once. Everything is printed on the card. The cost is paid when it is finished, by whoever holds the throne then. Two works underway at once.": "Construir nunca rola dado. Pegue uma das obras do mercado; outra a substitui logo. Tudo está impresso na carta. O custo é pago quando a obra é concluída, por quem estiver no trono então. Duas obras em andamento por vez.", "Take one work from the market. No roll.": "Pegue uma obra do mercado. Sem rolagem.", "choose a different action instead": "escolher outra ação", "No new taxes": "Sem novos impostos", "Never collect taxes during your reign": "Nunca cobre impostos durante seu reinado", "Pay every debt": "Pague toda dívida", "No grand feasts": "Sem grandes banquetes", "Never spend grain on a great feast": "Nunca gaste grão em um grande banquete", "Live off the stores": "Viva das reservas", "Never harvest during your reign": "Nunca colha durante seu reinado", "No new stones": "Nenhuma pedra nova", "Begin no work during your reign": "Não inicie nenhuma obra durante seu reinado", "Hoard for the heir": "Guarde para o herdeiro", "End your reign with 8 or more gold": "Termine seu reinado com 8 ou mais de ouro", "Fill the granaries": "Encha os celeiros", "End your reign with 8 or more grain": "Termine seu reinado com 8 ou mais de grão", "The Plague Year": "O Ano da Peste", "The bells ring every morning. Nobody asks for whom.": "Os sinos tocam toda manhã. Ninguém pergunta por quem.", "The Old King's Creditors": "Os Credores do Velho Rei", "They lent to your grandfather. They remember the terms.": "Emprestaram ao seu avô. Lembram-se dos termos.", "Which debt is forgiven?": "Qual dívida é perdoada?", "keep the favour for now": "guardar o favor por ora", "Cancel any one of your crises outright.": "Cancele qualquer uma das suas crises.", "The Loan": "O Empréstimo", "Every lender is an optimist.": "Todo credor é um otimista.", "A rival may lend the drawing realm 4 gold. If they do, the drawing realm owes them 6 gold within 3 turns — a debt no pardon or privilege can touch. Unpaid, it costs 2 legacy.": "Um rival pode emprestar 4 de ouro ao reino que comprou a carta. Se emprestar, esse reino lhe deve 6 de ouro em até 3 turnos — uma dívida que nenhum perdão ou privilégio alcança. Sem pagamento, custa 2 de legado.", "The Dowry": "O Dote", "Everyone agrees on the match. Nobody agrees on the price.": "Todos concordam com o casamento. Ninguém concorda com o preço.", "The drawing realm names a price between 2 and 6 gold for 2 legacy. A rival may accept, refuse, or counter once with a price of their own.": "O reino que comprou a carta fixa um preço entre 2 e 6 de ouro por 2 de legado. Um rival pode aceitar, recusar ou contrapropor uma vez com seu próprio preço.", "Lend 4 gold": "Emprestar 4 de ouro", "Accept": "Aceitar", "Counter": "Contrapropor", "Refuse": "Recusar", "Both realms may pay 2 gold. Both pay, both gain 2 legacy. Only one pays, that one gains 1 and the other loses 1.": "Os dois reinos podem pagar 2 de ouro. Se ambos pagarem, ambos ganham 2 de legado. Se só um pagar, esse ganha 1 e o outro perde 1.", "The Scribe's Copy": "A Cópia do Escriba", "He was not supposed to read it. He read it twice.": "Ele não devia ter lido. Leu duas vezes.", "Look at the next three chronicle cards and put them back in any order.": "Veja as próximas três cartas da crônica e devolva-as em qualquer ordem.", "A Second Opinion": "Uma Segunda Opinião", "The physician disagreed. So did the next one.": "O médico discordou. O seguinte também.", "Re-roll the die of an action you have just taken.": "Role de novo o dado de uma ação que você acabou de fazer.", "A Name Already Chosen": "Um Nome Já Escolhido", "The succession was settled years ago, quietly.": "A sucessão foi decidida há anos, em silêncio.", "When your reign ends, choose your heir from the entire court. Not if you were cast out, and not while a Schemer rules anywhere.": "Quando seu reinado terminar, escolha o herdeiro entre toda a corte. Não se você for deposto, nem enquanto um Intrigante reinar em qualquer lugar.", "The Envoy": "O Emissário", "He speaks for you. He is very persuasive about it.": "Ele fala por você. E é muito persuasivo.", "When an offer or shared fate is put to you, send it on to another realm instead. With no other realm to send it to, decline it without cost.": "Quando uma proposta ou destino comum for dirigido a você, envie-o a outro reino. Sem outro reino para enviar, recuse-o sem custo.", "The next three years": "Os próximos três anos", "Tap them in the order they will be drawn, first to last.": "Toque-os na ordem em que serão comprados, do primeiro ao último.", "start the order again": "recomeçar a ordem", "decline it without cost": "recusar sem custo", "a favour is owed to you": "um favor lhe é devido", "while it stands, Disrupts against you are halved": "enquanto estiver de pé, sabotagens contra você valem metade", "Gained": "Ganhou", "The next crisis will come slower.": "A próxima crise virá mais devagar.", "is owed to you.": "lhe é devido.", "Kept": "Cumprida", "Broken": "Quebrada", "void if cast out": "anulada se deposto", "built in": "pronta em", "Now": "Agora", "On completion": "Na conclusão", "pay": "pague", "It gives": "Rende", "Begin the work": "Iniciar a obra", "back to the market": "voltar ao mercado", "Your heir also holds this ruler’s strength for their first turn, alongside their own.": "Seu herdeiro também tem a força deste governante no primeiro turno, além da sua própria.", "End with 6 or more gold and 6 or more grain": "Termine com 6 ou mais de ouro e 6 ou mais de grão", "Two gold to move against a rival: cost them support, set a work back, or drag one of their debts closer. Bring them to zero support and they are cast out — and you gain {T} legacy.": "Dois ouro para agir contra um rival: tirar apoio, atrasar uma obra ou antecipar uma dívida. Leve-o a zero de apoio e ele é deposto — e você ganha {T} de legado.", "not its moment": "não é o momento", "Involve no one": "Não envolver ninguém", "it falls to you alone": "recai só sobre você", "Confirm this ruler": "Confirmar este governante", "Too little of the age remains for a promise to be judged. None is made.": "Resta pouco da era para que uma promessa seja julgada. Nenhuma é feita.", "Gold and grain pay for crises and for works, and neither may pass 20. Support is different: it never passes 12, and it is also your ruler’s life. If it reaches zero they are thrown out — and of the two ways to lose a throne, that is by far the worse one. More on this later.": "Ouro e grão pagam crises e obras, e nenhum dos dois passa de 20. O apoio é diferente: nunca passa de 12, e é também a vida do seu governante. Se chegar a zero, ele é deposto — e, das duas formas de perder o trono, essa é de longe a pior. Mais sobre isso adiante.", "A claimant": "Um pretendente", "Crown this claimant": "Coroar este pretendente", "look at the other": "ver o outro", "cannot be finished in time": "não dá tempo de concluir", "no work can be finished in time": "nenhuma obra dá tempo de concluir", "a player": "um jogador", "open": "livre", "waiting for someone to join": "esperando alguém entrar", "court": "corte", "not in play": "fora do jogo", "Tap a realm to change it: open for a player, a court, or out of the game.": "Toque num reino para mudá-lo: livre para um jogador, uma corte, ou fora do jogo.", "At least two realms must be in play.": "Ao menos dois reinos precisam estar em jogo.", "Length of the age": "Duração da era", "That table has no open seat.": "Essa mesa não tem lugar livre.", "Another realm moved first.": "Outro reino agiu primeiro.", "How legacy is earned": "Como se ganha legado", "Every road to legacy:": "Todos os caminhos para o legado:", "Settle a crisis": "Resolver uma crise", "Finish a work": "Concluir uma obra", "Keep a promise": "Cumprir uma promessa", "Cast out a rival": "Depor um rival", "Cards and favours": "Cartas e favores", "+1 to +4": "+1 a +4", "+3 to +12": "+3 a +12", "+2 to +4": "+2 a +4", "varies": "varia", "the odd +1": "+1 ocasional", "+5": "+5", "+2": "+2", "+3": "+3", "Legacy is lost by: leaving a crisis unresolved · breaking a promise · being cast out · delaying a work": "Perde-se legado ao: deixar uma crise sem resolver · quebrar uma promessa · ser deposto · atrasar uma obra", "This is your ruler. Each one has a strength and a weakness, printed just below — ▲ the strength, ▼ the weakness. The next ruler will have different ones.": "Este é seu governante. Cada um tem uma força e uma fraqueza, logo abaixo — ▲ a força, ▼ a fraqueza. O próximo governante terá outras.", "These are your legacy points. They decide the game. At the end I will show you every way to earn them.": "Estes são seus pontos de legado. São eles que decidem o jogo. No fim eu mostro todas as formas de ganhá-los.", "Your resources": "Seus recursos", "Gold, grain and support are your resources. Gold and grain pay for crises and works — 20 of each at most. Support is different: 12 at most, and it is your ruler’s life. At zero they are cast out.": "Ouro, grão e apoio são seus recursos. Ouro e grão pagam crises e obras — teto de 20 cada. O apoio é diferente: teto de 12, e é a vida do seu governante. A zero, ele é deposto.", "How many turns this ruler has lived. At the end of the age, the realm that held the LONGEST reign gains 5 legacy — matching it is not enough, you must beat it. But the longer a ruler reigns, the easier they fall. More on that at the end of the turn.": "Quantos turnos este governante já viveu. No fim da era, o reino que tiver tido o reinado MAIS LONGO ganha 5 de legado — igualar não basta, é preciso superar. Mas quanto mais tempo ele reina, mais fácil é cair. Explico no fim do turno.", "64 cards, and half of them are crises. The rest are boons, favours, offers and shared fates — some help you, some bring a rival to the table. Every turn opens by drawing one.": "São 64 cartas, e metade são crises. As outras são dádivas, favores, propostas e destinos comuns — algumas ajudam você, outras trazem um rival para a mesa. Toda rodada começa comprando uma.", "Every card says what it does. A crisis shows what it demands and how many turns until it falls due. A boon gives at once. A favour is kept until you choose to spend it. Offers and shared fates involve a rival.": "Cada carta diz o que faz. Uma crise mostra o que cobra e em quantos turnos vence. Uma dádiva dá na hora. Um favor fica guardado até você decidir usar. Propostas e destinos comuns envolvem um rival.", "Managing actions is the heart of the game. Only two a turn, and you can never do everything: what your resources need, what your debts demand, and what your ruler is good at rarely point the same way.": "Administrar ações é o coração do jogo. São só duas por turno, e nunca dá para fazer tudo: o que seus recursos pedem, o que suas dívidas cobram e o que seu governante faz bem raramente apontam para o mesmo lado.", "Roll a die and gain that much grain.": "Role um dado e ganhe aquele tanto de grão.", "Roll a die and gain that much gold — but it costs 1 support, and the gold only arrives at the end of your turn. Once a turn.": "Role um dado e ganhe aquele tanto de ouro — mas custa 1 de apoio, e o ouro só chega no fim do seu turno. Uma vez por turno.", "Roll a die and gain half of it in support. Spend 4 grain on a great feast and gain the whole die instead.": "Role um dado e ganhe metade em apoio. Gaste 4 de grão num grande banquete e ganhe o dado inteiro.", "Works are the largest source of legacy. You pay a deposit now, choose the work, and pay the rest when it is finished. Each new work costs a larger deposit than the last.": "As obras são a maior fonte de legado. Você paga um depósito agora, escolhe a obra, e paga o resto quando ela fica pronta. Cada obra nova custa um depósito maior que a anterior.", "Debts fall due": "As dívidas vencem", "Now everything that has come due asks to be paid. Pay what you can. What you cannot pay is left unresolved, and costs legacy.": "Agora tudo que venceu cobra. Pague o que puder. O que não for pago fica sem resolver, e custa legado.", "At the end of every turn, your last act is the crown roll. One die for each turn your ruler has lived. Any 6 CROWN ends the reign. Every 1 ONE costs 1 support.": "No fim de cada turno, seu último ato é rolar os dados da coroa. Um dado para cada turno que seu governante viveu. Qualquer 6 CROWN encerra o reinado. Cada 1 ONE custa 1 de apoio.", "Your last act binds your heir to one condition, judged when THEIR reign ends. Kept, it pays legacy. Broken, it costs. It is void if that reign lasts two turns or less, or if the heir is cast out — and none is made at all when the age has two turns left.": "Seu último ato obriga o herdeiro a uma condição, julgada quando o reinado DELE terminar. Cumprida, rende legado. Quebrada, custa. É anulada se esse reinado durar dois turnos ou menos, ou se o herdeiro for deposto — e nenhuma é feita quando restam dois turnos de era.", "What can go wrong with a work": "O que pode dar errado numa obra", "A work can lose legacy three ways. Cannot pay when it falls due? It is delayed and costs 2 legacy. A ruler cast out? Every work under construction loses 1 legacy. A rival’s Disrupt? 1 legacy gone for good.": "Uma obra pode perder legado de três formas. Não conseguiu pagar quando venceu? Ela atrasa e custa 2 de legado. Governante deposto? Cada obra em construção perde 1 de legado. Sabotagem de um rival? 1 de legado a menos, para sempre.", "Don’t pay": "Não pagar", "Crises unresolved": "Crises não resolvidas", "Not paying a crisis costs him 1 less legacy": "Não pagar uma crise lhe custa 1 de legado a menos", "Leave no crisis unresolved during your reign": "Não deixe nenhuma crise sem resolver durante seu reinado", "Two gold to move against a rival: cost them support, set a work back, or drag one of their debts closer. Bring a rival to zero support and they are cast out — and you gain {T} legacy.": "Dois de ouro para agir contra um rival: tirar apoio, atrasar uma obra ou antecipar uma dívida. Leve um rival a zero de apoio e ele é deposto — e você ganha {T} de legado.", "This is the ruler sitting on your throne right now. Every ruler has one strength and one weakness, shown just below: ▲ is what they do well, ▼ is what they do badly. When this one dies, the next will have a different pair.": "Este é o governante que está no seu trono agora. Todo governante tem uma força e uma fraqueza, mostradas logo abaixo: ▲ é o que ele faz bem, ▼ é o que ele faz mal. Quando este morrer, o próximo terá outro par.", "This number is your legacy. It is the only score in the game, and whoever has the most when the age ends wins. At the end of this walkthrough I will show you every way to earn it.": "Este número é o seu legado. É a única pontuação do jogo, e quem tiver mais quando a era terminar vence. No fim deste guia eu mostro todas as formas de ganhá-lo.", "Gold, grain and support are your three resources. Gold and grain pay for crises and for works, and you can never hold more than 20 of either at one time. Support is different: you can never hold more than 12 of it, and it is also your ruler’s life — if it ever reaches zero, they are thrown off the throne.": "Ouro, grão e apoio são seus três recursos. Ouro e grão pagam crises e obras, e você nunca pode ter mais de 20 de cada um ao mesmo tempo. O apoio é diferente: você nunca pode ter mais de 12, e ele também é a vida do seu governante — se chegar a zero, ele é tirado do trono.", "This counts how many turns your current ruler has lived. At the end of the age, whoever held the longest reign of the whole game earns 5 extra legacy — and you have to beat the others outright, since matching the longest is not enough. The catch is that the longer a ruler stays on the throne, the more likely they are to fall. I will show you why at the end of this turn.": "Isto conta quantos turnos o seu governante atual já viveu. No fim da era, quem tiver tido o reinado mais longo de todo o jogo ganha 5 de legado a mais — e é preciso superar os outros, porque empatar com o mais longo não basta. O problema é que, quanto mais tempo um governante fica no trono, maior a chance de ele cair. Eu mostro o porquê no fim deste turno.", "The chronicle deck holds 64 cards, and half of them are crises. The rest are boons, favours, offers and shared fates — some of them help you, some of them pull a rival into it. Every turn begins by drawing one.": "O baralho da crônica tem 64 cartas, e metade delas são crises. As outras são dádivas, favores, propostas e destinos comuns — algumas ajudam você, outras puxam um rival para a história. Todo turno começa comprando uma.", "Every card tells you what it does. A crisis shows what it will cost you and how many turns you have before it comes due. A boon gives you something straight away. A favour is yours to keep until you decide to use it. Offers and shared fates bring a rival into the decision.": "Toda carta diz o que faz. Uma crise mostra o que vai custar e quantos turnos você tem até ela vencer. Uma dádiva dá alguma coisa na hora. Um favor fica com você até decidir usá-lo. Propostas e destinos comuns trazem um rival para a decisão.", "Deciding what to do with your actions is the heart of this game. You only get two each turn, and there is never enough time for everything: what your resources need, what your debts are about to demand, and what your ruler happens to be good at are rarely the same thing.": "Decidir o que fazer com suas ações é o coração deste jogo. Você só tem duas por turno, e nunca dá tempo para tudo: o que seus recursos precisam, o que suas dívidas estão prestes a cobrar e aquilo que seu governante faz bem raramente são a mesma coisa.", "Roll one die and take that much grain.": "Role um dado e pegue aquela quantidade de grão.", "Roll one die and take that much gold. It costs you 1 support, and the gold does not arrive until the end of your turn, so it cannot pay something that falls due today. You may only do this once a turn.": "Role um dado e pegue aquela quantidade de ouro. Custa 1 de apoio, e o ouro só chega no fim do seu turno, então não dá para pagar algo que vence hoje. Você só pode fazer isso uma vez por turno.", "Roll one die and gain half of it in support. If you spend 4 grain on a great feast instead, you gain the whole die.": "Role um dado e ganhe metade dele em apoio. Se preferir gastar 4 de grão num grande banquete, você ganha o dado inteiro.", "Works are the largest source of legacy in the game. You pay a deposit now to begin one, and the rest of its cost when it is finished. Every work you begin costs a larger deposit than the one before it.": "As obras são a maior fonte de legado do jogo. Você paga um depósito agora para começar uma, e o resto do custo quando ela ficar pronta. Cada obra que você começa custa um depósito maior que a anterior.", "Two gold lets you move against a rival: take away some of their support, set one of their works back, or drag one of their debts closer. If you bring a rival all the way down to zero support, they are thrown off the throne and you gain {T} legacy.": "Dois de ouro permitem agir contra um rival: tirar parte do apoio dele, atrasar uma obra dele ou puxar uma dívida dele para mais perto. Se você levar um rival até zero de apoio, ele é tirado do trono e você ganha {T} de legado.", "At the end of every turn, your last act is to roll the crown dice. You roll one die for every turn your ruler has lived. If any die shows a 6, the reign ends right there. Every 1 costs you 1 support.": "No fim de cada turno, seu último ato é rolar os dados da coroa. Você rola um dado para cada turno que seu governante viveu. Se qualquer dado cair em 6, o reinado acaba ali. Cada 1 custa 1 de apoio.", "Your last act as a ruler is to bind your heir to a single promise, which is judged when THEIR reign ends rather than yours. If they keep it they gain legacy, and if they break it they lose some. It counts for nothing if that reign lasts two turns or less, or if the heir is thrown off the throne — and no promise is made at all when only two turns of the age remain.": "Seu último ato como governante é obrigar o herdeiro a uma promessa, julgada quando o reinado DELE terminar, não o seu. Se ele cumprir, ganha legado; se quebrar, perde. Ela não vale nada se esse reinado durar dois turnos ou menos, ou se o herdeiro for tirado do trono — e nenhuma promessa é feita quando restam só dois turnos de era.", "Everything that has come due is asking to be paid now. Pay what you can afford. Anything you cannot pay is left unresolved, and that costs you legacy.": "Tudo o que venceu está cobrando agora. Pague o que você puder. O que não der para pagar fica sem resolver, e isso custa legado.", "A work can lose legacy in three ways. If you cannot pay when it comes due, the work is delayed and you lose 2 legacy. If your ruler is thrown off the throne, every work still under construction loses 1 legacy. And if a rival disrupts it, it loses 1 legacy for good.": "Uma obra pode perder legado de três formas. Se você não conseguir pagar quando ela vencer, a obra atrasa e você perde 2 de legado. Se seu governante for tirado do trono, cada obra ainda em construção perde 1 de legado. E se um rival sabotá-la, ela perde 1 de legado para sempre."};

const shuffle=a=>{const b=[...a];
 for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=b[i];b[i]=b[j];b[j]=t;}
 return b;};   /* Fisher-Yates — sort with a random comparator is badly biased */

const CAP=20;
const capAll=p=>{if(p.gold>CAP)p.gold=CAP;if(p.grain>CAP)p.grain=CAP;if(p.support>12)p.support=12;};
const clampLegacy=()=>{if(G)G.players.forEach(x=>{if(x.legacy<0){x.ledger.floored+=(-x.legacy);x.legacy=0;};});};
const cost=o=>Object.entries(o).filter(([k,v])=>v>0).map(([k,v])=>v+" "+tr(k)).join(" + ")||tr("nothing");
const workCap=r=>(r==="architect"||(G&&G.players&&G.players[G.active]&&G.players[G.active].ruler===r&&G.players[G.active].lentBoon==="architect"))?3:r==="zealot"?1:2;
const deposit=p=>2+2*p.worksBegun;   /* your nth work costs 1+n gold to begin */
const intrigueCost=rid=>(rid==="warlord"||(G&&G.players&&G.players[G.active]&&G.players[G.active].ruler===rid&&G.players[G.active].lentBoon==="warlord"))?0:2;
const finalCost=(w,rid)=>w.cost;

/* the Regent pays 1 less of each resource on debts he did not incur */
const standing=p=>{                      /* trailing, level, or leading on legacy */
 const mine=p.legacy, others=G.players.filter(x=>x!==p).map(x=>x.legacy);
 const top=Math.max.apply(null,others);
 return mine<top?"trail":mine>top?"lead":"level";};

/* every way this crisis may be settled, in order */
function payOptions(c,p){
 const o=[];
 if(c.fam==="either") c.opts.forEach(x=>o.push({cost:x,label:cost(x)}));
 else if(c.fam==="pos"){const k={}; k[c.res]=c[standing(p)]; o.push({cost:k,label:cost(k)});}
 else if(c.fam==="act"){o.push({cost:{},label:tr("Forfeit an action"),forfeit:true});
                        o.push({cost:c.demand,label:cost(c.demand)});}
 else o.push({cost:c.demand,label:cost(c.demand)});
 if((p.ruler==="diplomat"||p.lentBoon==="diplomat")&&p.support>=2&&!c.loan) o.push({cost:{support:2},label:tr("Negotiate")+" \u2014 2 "+tr("support"),neg:true});
 return o;}
const effDemand=(c,p)=>payOptions(c,p)[0].cost;   /* the headline price, for display */

function checkT(id,p){
 switch(id){
  case"provide":return p.flags.settled>=2;
  case"endure": return p.reignTurn>=4;
  case"treasury":return p.gold>=6&&p.grain>=6;
  case"notax":  return p.flags.taxCount===0;
  case"debts":  return p.flags.refused===0;
  case"nogreat":return !p.flags.greatFeast;
  case"noharv": return !p.flags.harvested;
  case"nostone":return !p.flags.began;
  case"hoard":  return p.gold>=8;
  case"fill":   return p.grain>=8;}
 return false;}

function endReign(type){          /* 'fall' | 'deposed' | 'warlord' */
 const p=P();
 const tooShort=p.reignTurn<=2;
 if(p.testament&&(type==="deposed"||tooShort)){
  /* cast out for want of support: the promise dies with the reign, neither kept nor broken */
  G.lastTestament={id:p.testament,kept:null,amount:0,doubled:false,dimmed:false,voided:true};
  note(type==="deposed"?"logTestVoid":"logTestShort",{p:p.name});}
 else if(p.testament){
  const t=testam(p.testament),k=checkT(p.testament,p),m=p.ruler==="martyr"?2:0;
  const amt=k?(t.up+m):-(t.down+m);
  p.legacy+=amt;p.ledger.testament+=amt;
  note(k?"logTestOK":"logTestNo",{p:p.name,n:Math.abs(amt)});
  G.lastTestament={id:p.testament,kept:k,amount:amt,doubled:m===2,dimmed:false};}
 else G.lastTestament=null;
 if(p.flags.bard){p.legacy+=1;p.ledger.boon+=1;p.flags.bard=false;note("logBard",{p:p.name});}
 if(p.longPeace&&p.reignNo>=p.longPeace&&type!=="deposed"){p.legacy+=4;p.ledger.boon+=4;p.longPeace=null;
  note("logPeace",{p:p.name});}
 if(p.ruler==="usurper"){p.legacy-=2;p.ledger.usurper+=2;note("logUsurper",{p:p.name});}
 if(type==="deposed"){p.legacy-=1;p.ledger.deposed+=1;
  /* the masons lose a season to every fallen ruler */
  p.projects.forEach(w=>{ if(w.reward>1){w.reward-=1;w.mourned=(w.mourned||0)+1;} });}
 G.succType=type;
 G.heirSupport=(type==="fall")?Math.max(3,half(p.support)):3;

 if(type==="deposed"){
  const top=G.courtDeck[0];
  G.offer={rulers:[top],testaments:pick(TESTAMENTS,2).map(t=>t.id),chosenRuler:top,forced:true,heirDie:null};
  note("logCourtTop",{p:p.name,r:ruler(top).name});
 } else {
  const two=G.courtDeck.slice(0,2);
  const plotter=G.players.findIndex((x,xi)=>xi!==G.active&&x.ruler==="schemer");
  if(p.ruler==="schemer")
   G.offer={rulers:two,testaments:pick(TESTAMENTS,2).map(t=>t.id),chosenRuler:two[0],forced:true,heirDie:null};
  else if(plotter>-1&&!isBot(plotter)){
   /* the Schemer decides in person */
   G.offer={rulers:two,testaments:pick(TESTAMENTS,2).map(t=>t.id),chosenRuler:null,forced:true,heirDie:null,byPlot:plotter};
   G.promptCtx={from:G.active,to:plotter,cid:"schemer"};
   G.prompt={cid:"schemer",name:tr("The Schemer's word"),
     line:msg("schemerAsks",{p:tr(p.name)}),seat:plotter,
     opts:two.map(function(rid,ix){
       const r=ruler(rid);
       return {id:String(ix),label:tr(r.name),note:tr(r.boon)};})};
  }
  else if(plotter>-1)
   G.offer={rulers:two,testaments:pick(TESTAMENTS,2).map(t=>t.id),chosenRuler:schemerPick(two,p),forced:true,heirDie:null};
  else
   G.offer={rulers:two,testaments:pick(TESTAMENTS,2).map(t=>t.id),chosenRuler:null,forced:false,heirDie:null};
 }

 G.phase="succession";}

/* the Schemer hands a rival the ruler that suits them least */
function schemerPick(two,victim){
 const worth=rid=>{
  let v=0;
  if(rid==="warlord")v-=3; if(rid==="usurper")v-=2; if(rid==="bastard")v-=1;
  if(rid==="architect"&&victim.projects.length)v+=3;
  if(rid==="merchant"||rid==="steward"||rid==="collector")v+=2;
  if(rid==="zealot")v+=2; if(rid==="ironqueen")v+=2; if(rid==="marshal")v+=2;
  if(rid==="regent"&&victim.crises.length)v+=2;
  return v;};
 return worth(two[0])<=worth(two[1])?two[0]:two[1];}

function finalReckoning(){
 G.players.forEach(x=>{x.finalNotes=[];
  if(x.pendingGold){x.gold+=x.pendingGold;x.pendingGold=0;}
  if(x.testament&&x.reignTurn>0&&x.support>0){const t=testam(x.testament),k=checkT(x.testament,x),m=x.ruler==="martyr"?2:0;
   const amt=k?(t.up+m):-(t.down+m);x.legacy+=amt;x.ledger.testament+=amt;
   x.finalNotes.push({text:tr("The promise")+": "+tr(t.text)+" \u2014 "+tr(k?"honoured":"broken"),amt});}
  else if(x.testament){
   x.finalNotes.push({text:tr("A promise made too late to be kept or broken"),amt:0});}
  x.crises.forEach(c=>{x.legacy-=c.penalty.legacy;x.ledger.final+=c.penalty.legacy;
   x.finalNotes.push({text:tr(c.name)+" "+tr("left unsettled"),amt:-c.penalty.legacy});});
  x.projects.forEach(w=>x.finalNotes.push({text:tr(w.name)+" "+tr("left unfinished"),amt:0}));});
 if(G.longest.seat!==null){
  const w=G.players[G.longest.seat];
  w.legacy+=5;w.ledger.longest=5;
  w.finalNotes.push({text:tr("The longest reign of the age")+" \u2014 "+G.longest.turns+" "+tr("turns"),amt:5});}

function applyChronicle(card){
 const p=P();G.drawn=card;
  if(card.type!=="shared"&&card.type!=="offer")G.outcome=null;
 if(card.type==="crisis"){
  let t=p.ruler==="spymaster"?Math.max(1,card.turns-1):((p.ruler==="regent"||p.lentBoon==="regent")?card.turns+1:card.turns);
  if(p.respite){t+=1;p.respite=false;}
  p.crises.push(Object.assign({},card,{due:p.turnsTaken+t,reign:p.reignNo,key:Math.random()}));
  note("logCrisis",{p:p.name,c:card.name});}
 else if(card.type==="boon"){Object.entries(card.gain||{}).forEach(([k,v])=>{p[k]+=v;if(k==="legacy")p.ledger.boon+=v;});
  if(card.later==="bard")p.flags.bard=true;
  if(card.later==="peace")p.longPeace=p.reignNo+1;
  if(Object.keys(card.gain||{}).length)note("logBoon",{p:p.name,c:card.name,g:card.gain});
  else note("logCrisis",{p:p.name,c:card.name});}
 else if(card.type==="favour"){p.favours.push({id:card.id,key:Math.random(),born:p.turnsTaken});note("logFavour",{p:p.name,c:card.name});}
 else if(card.type==="shared"){resolveShared(card);}
 else if(card.type==="offer"){resolveOffer(card);}
 else note("logCrisis",{p:p.name,c:card.name});
 G.phase="court";
 G.court={step:"choose",action:null,target:null,targetKey:null,targetSeat:null,great:false,die:null,text:"",work:null,offerWorks:null,done:0,used:[]};
 if(!isBot(G.active)&&!G.skipCardUp)G.cardUp={card:card,outcome:G.outcome||null,say:Math.floor(Math.random()*7)};
 G.skipCardUp=false;}

function chronKeep(i){

 if(opts.length&&other){
  if(isBot(G.active)){giveYear(opts[0],other,kept);return;}
  G.chronGive={card:other,kept:kept,opts:opts};
