function botAnswer(cid,seat,opts){
 const o=G.players[seat], n=temper(seat), c=G.promptCtx, from=G.players[c.from];
 switch(cid){
  case"offerTo": case"sharedTo": return opts[Math.floor(Math.random()*opts.length)].id;
  case"marriage": return (n<=1)?"yes":"no";   /* worth taking unless they are already well ahead */
  case"loan":     return (o.gold>=7&&n>=-1)?"yes":"no";   /* lend only from plenty */
  case"dowryPrice":return "4";
  case"dowry":    { const pr=(G.promptCtx&&G.promptCtx.price)||4;
                    if(o.gold>=pr+2&&pr<=4)return "yes";
                    if(pr>4&&o.gold>=5)return "c3";
                    return "no"; }
  case"dowryFinal":{ const pr=(G.promptCtx&&G.promptCtx.price)||0; return pr>=3?"yes":"no"; }
  case"ransom":   return (o.gold>=4&&n<=0)?"yes":"no";
  case"debt":     return o.grain>=3&&o.grain>=o.gold?"grain":(o.gold>=3?"gold":"no");
  case"road":     return (o.gold>=2&&n>=-1)?"yes":"no";
  case"sanctuary":return (n>=1&&o.gold+o.grain>10)?"yes":"no";
  case"famine":   return (o.grain>=3)?"yes":"no";   /* giving costs nothing but grain */
  case"bishop":   return (o.gold>=6&&n<=1)?"yes":"no";
  case"peace":    return n>=0?"yes":"no";
  case"legate":   return (o.gold>=2*(G.players.length-1)&&n>=0)?"gold":"legacy";}
 return opts[0].id;}

function answerPrompt(choice){
 const c=G.promptCtx, from=G.players[c.from], to=(c.to!=null?G.players[c.to]:null);
 let text="";
 if(c.cid==="sharedTo"){
  if(choice==="none"){G.prompt=null;G.promptCtx=null;keepToSelf(SHARED_CARDS.find(x=>x.id===c.card),c.from);return;}
  const t=parseInt(choice,10);
  const card=SHARED_CARDS.find(x=>x.id===c.card);
  G.prompt=null; const keep=c.from; G.promptCtx={from:keep};
  sharedTo(card,t); return;}
 if(c.cid==="schemer"){
  const ix=parseInt(choice,10);
  G.offer.chosenRuler=G.offer.rulers[ix];
  note("logSchemer",{p:tr(G.players[c.to].name),o:tr(from.name),r:tr(ruler(G.offer.chosenRuler).name)});
  G.prompt=null;G.promptCtx=null;render();return;}
 if(c.cid==="offerTo"){
  if(choice==="none"){G.prompt=null;G.promptCtx=null;keepToSelf(OFFER_CARDS.find(x=>x.id===c.card),c.from);return;}
  const t=parseInt(choice,10);
  const card=OFFER_CARDS.find(x=>x.id===c.card);
  G.prompt=null;
  const keep=c.from; G.promptCtx={from:keep};
  offerTo(card,t);
  return;}
 switch(c.cid){
  case"marriage":
   if(choice==="yes"&&from.grain>=3){from.grain-=3;to.grain+=3;tableLegacy(from,3);tableLegacy(to,2);
    text=msg("offMarryY",{o:tr(to.name)});}
   else{to.support-=1;tableLegacy(from,-1);text=msg("offMarryN",{o:tr(to.name)});}
   break;
  case"loan":
   if(choice==="yes"&&to.gold>=4){
    to.gold-=4; from.gold=Math.min(20,from.gold+4);
    from.crises.push({fam:"std",name:"The Loan",line:"Every lender is an optimist.",
     demand:{gold:6},turns:3,penalty:{legacy:2,support:0},loan:true,lender:G.players.indexOf(to),
     due:from.turnsTaken+3,reign:from.reignNo,key:Math.random()});
    text=msg("offLoanY",{o:tr(to.name)});}
   else text=msg("offLoanN",{o:tr(to.name)});
   break;
  case"dowryPrice":{
   const price=parseInt(choice,10);
   G.prompt=null;
   ask("dowry",tr("The Dowry"),msg("dowryAsk",{p:tr(from.name),n:price}),G.players.indexOf(to),
    [{id:"yes",label:tr("Accept")+" \u2014 "+price+" "+tr("gold")},
     {id:"no",label:tr("Refuse")}].concat(
      [2,3,4,5,6].filter(n=>n!==price).map(n=>({id:"c"+n,label:tr("Counter")+" \u2014 "+n+" "+tr("gold")}))),
    {from:G.players.indexOf(from),to:G.players.indexOf(to),price:price});
   return;}
  case"dowry":{
   const c2=G.promptCtx, price=c2.price;
   if(choice==="yes"){
    if(to.gold>=price){to.gold-=price;from.gold=Math.min(20,from.gold+price);tableLegacy(to,2);
     text=msg("offDowryY",{o:tr(to.name),n:price});}
    else text=msg("offDowryPoor",{o:tr(to.name)});}
   else if(choice[0]==="c"){
    /* one counter, and the drawing realm has the last word */
    const offer=parseInt(choice.slice(1),10);
    G.prompt=null;
    ask("dowryFinal",tr("The Dowry"),msg("dowryCounter",{o:tr(to.name),n:offer}),G.players.indexOf(from),
     YESNO(tr("Accept")+" \u2014 "+offer+" "+tr("gold"),"Refuse"),
     {from:G.players.indexOf(from),to:G.players.indexOf(to),price:offer});
    return;}
   else text=msg("offDowryN",{o:tr(to.name)});
   break;}
  case"dowryFinal":{
   const price=G.promptCtx.price;
   if(choice==="yes"&&to.gold>=price){to.gold-=price;from.gold=Math.min(20,from.gold+price);tableLegacy(to,2);
    text=msg("offDowryY",{o:tr(to.name),n:price});}
   else text=msg("offDowryN",{o:tr(to.name)});
   break;}
  case"ransom":
   if(choice==="yes"&&to.gold>=4){to.gold-=4;from.gold+=4;text=msg("offRansomY",{o:tr(to.name)});}
   else{to.support-=2;text=msg("offRansomN",{o:tr(to.name)});}
   break;
  case"debt":
   if(choice==="grain"&&to.grain>=3){to.grain-=3;from.grain+=3;text=msg("offDebtY",{o:tr(to.name),res:tr("grain")});}
   else if(choice==="gold"&&to.gold>=3){to.gold-=3;from.gold+=3;text=msg("offDebtY",{o:tr(to.name),res:tr("gold")});}
   else{tableLegacy(from,2);text=msg("offDebtN",{o:tr(to.name),p:tr(from.name)});}
   break;
  case"road":{
   const iPay=from.gold>=2, they=(choice==="yes"&&to.gold>=2);
   if(iPay&&they){from.gold-=2;to.gold-=2;tableLegacy(from,2);tableLegacy(to,2);text=msg("offRoadBoth");}
   else if(iPay){from.gold-=2;tableLegacy(from,1);tableLegacy(to,-1);text=msg("offRoadOne",{a:tr(from.name),b:tr(to.name)});}
   else if(they){to.gold-=2;tableLegacy(to,1);tableLegacy(from,-1);text=msg("offRoadOne",{a:tr(to.name),b:tr(from.name)});}
   else text=msg("offRoadNone");
   break;}
  case"sanctuary":{
   const worst=from.crises.filter(x=>!x.loan).sort((a,b)=>b.penalty.legacy-a.penalty.legacy)[0];
   if(choice==="yes"&&worst){from.crises=from.crises.filter(x=>x.key!==worst.key);
    to.crises.push(Object.assign({},worst,{due:to.turnsTaken+2,reign:to.reignNo,key:Math.random()}));
    tableLegacy(to,3);text=msg("offSancY",{o:tr(to.name),c:tr(worst.name)});}
   else text=msg("offSancN",{o:tr(to.name)});
   break;}
  case"famine":{
   /* each realm answers for itself; giving is safe, and the bonus needs both */
   const gaveThem=(choice==="yes"&&to.grain>=3);
   const gaveUs=(from.grain>=3);
   if(gaveThem)to.grain-=3; else tableLegacy(to,-2);
   if(gaveUs)from.grain-=3; else tableLegacy(from,-2);
   if(gaveThem&&gaveUs){tableLegacy(from,2);tableLegacy(to,2);}
   text=msg(gaveThem&&gaveUs?"famBoth":(gaveThem||gaveUs)?"famOne":"famNone",
     {a:tr(from.name),b:tr(to.name),g:tr((gaveThem?to:from).name),n:tr((gaveThem?from:to).name)});
   break;}
  case"bishop":
   if(choice==="yes"&&from.gold>=2){from.gold-=2;to.gold+=2;
    to.crises.push({fam:"std",name:tr("The Bishop Must Be Buried"),demand:{gold:4},turns:3,penalty:{legacy:3,support:0},
     due:to.turnsTaken+3,reign:to.reignNo,key:Math.random()});
    text=msg("bishopY",{o:tr(to.name)});}
   else{from.crises.push({fam:"std",name:tr("The Bishop Must Be Buried"),demand:{gold:4},turns:3,penalty:{legacy:3,support:0},
     due:from.turnsTaken+3,reign:from.reignNo,key:Math.random()});
    text=msg("bishopN");}
   break;
  case"peace":
   if(choice==="yes"){tableLegacy(from,2);tableLegacy(to,2);G.truce={a:c.from,b:c.to};
    text=msg("peaceY",{a:tr(from.name),b:tr(to.name)});}
   else text=msg("peaceN",{o:tr(to.name)});
   break;
  case"legate":{
   const L=G.players[c.to];
   if(choice==="gold"&&L.gold>=2*(G.players.length-1)){
    G.players.forEach((x,i)=>{if(i!==c.to){x.gold+=2;L.gold-=2;}});
    text=msg("legateGold",{L:tr(L.name)});}
   else{tableLegacy(L,-3);text=msg("legateLeg",{L:tr(L.name)});}
   break;}}
 G.outcome=text; note(tr(c.name)+" \u2014 "+text);
 G.prompt=null; G.promptCtx=null;}

/* what each answer actually does, shown on the button */
const OUTCOME_NOTE={
 marriage:{yes:"You take 3 grain and 2 legacy \u00b7 they gain 3 legacy",
           no:"You lose 1 support \u00b7 they lose 1 legacy"},
 ransom:  {yes:"You pay 4 gold",                       no:"You lose 2 support"},
 debt:    {grain:"You give 3 grain",                   gold:"You give 3 gold", no:"They gain 2 legacy"},
 road:    {yes:"You pay 2 gold \u00b7 if both pay, both gain 3 legacy", no:"If they pay alone, you lose 1 legacy"},
 sanctuary:{yes:"You take their crisis and gain 3 legacy", no:"Nothing changes"},
 famine:  {yes:"You give 3 grain \u00b7 if both give, both gain 2 legacy", no:"You lose 2 legacy"},
 bishop:  {yes:"You gain 2 gold and a 4 gold crisis \u00b7 settling it pays legacy", no:"It stays with them"},
 peace:   {yes:"Both gain 2 legacy \u00b7 breaking it costs 4", no:"No truce is made"},
 legate:  {gold:"You pay 2 gold to every other realm", legacy:"You lose 3 legacy"}
};

const YESNO=(a,b)=>[{id:"yes",label:a},{id:"no",label:b}];

function resolveShared(card){
 G.outcome=null;
 const me=G.active, all=G.players;
 if(card.id==="enemy"){
  all.forEach(x=>x.crises.forEach(c=>{c.due=Math.max(x.turnsTaken,c.due-1);}));
  G.outcome=msg("sharedEnemy");
  note(G.outcome);return;}
 if(card.id==="marches"){
  G.marches={by:me,left:all.length};
  G.outcome=msg("sharedMarch");
  note(G.outcome);return;}
 if(card.id==="legate"){
  let top=0; all.forEach((x,i)=>{if(x.legacy>all[top].legacy)top=i;});
  ask("legate",card.name,card.line,top,
      [{id:"gold",label:"Pay 2 gold to every other realm"},{id:"legacy",label:"Lose 3 legacy"}],
      {from:me,to:top});return;}
 if(!isBot(me)&&rivalSeats().length>1){
  G.promptCtx={cid:"sharedTo",name:tr(card.name),line:tr(card.line),from:me,card:card.id};
  G.prompt={cid:"sharedTo",name:tr(card.name),line:tr(card.line),seat:me,
   opts:rivalSeats().map(i=>({id:String(i),label:tr(G.players[i].name)}))
     .concat([{id:"none",label:tr("Involve no one"),note:tr("it falls to you alone")}])};
  return;}
 sharedTo(card,pickRival());}

/* no rival is drawn in: the drawing realm answers for itself, or lets it pass */
function keepToSelf(card,me){
 const p=G.players[me];
 if(card&&card.id==="bishop"){
  p.crises.push({fam:"std",name:card.name,line:card.flav||card.line,
   demand:{gold:4},turns:3,penalty:{legacy:3,support:0},
   due:p.turnsTaken+3,reign:p.reignNo,key:Math.random()});
  G.outcome=msg("keptBishop",{p:tr(p.name)});}
 else G.outcome=msg("keptNone",{p:tr(p.name),c:tr(card?card.name:"")});
 note(G.outcome);}

function sharedTo(card,t){
 const me=(G.promptCtx&&G.promptCtx.from!=null)?G.promptCtx.from:G.active;
 if(card.id==="famine") ask("famine",card.name,card.line,t,YESNO("Give 3 grain","Refuse"),{from:me,to:t});
 else if(card.id==="bishop") ask("bishop",card.name,card.line,t,YESNO("Take it for 4 gold","Decline"),{from:me,to:t});
 else if(card.id==="peace") ask("peace",card.name,card.line,t,YESNO("Accept the truce","Refuse"),{from:me,to:t});}

function resolveOffer(card){
 G.outcome=null;
 const me=G.active;
 if(!isBot(me)&&rivalSeats().length>1){
  /* the drawer chooses their mark before anyone answers */
  G.promptCtx={cid:"offerTo",name:tr(card.name),line:tr(card.line),from:me,card:card.id};
  G.prompt={cid:"offerTo",name:tr(card.name),line:tr(card.line),seat:me,
   opts:rivalSeats().map(i=>({id:String(i),label:tr(G.players[i].name)}))
     .concat([{id:"none",label:tr("Involve no one"),note:tr("it falls to you alone")}])};
  return;}
 offerTo(card,pickRival());}

function offerTo(card,t){
 const me=G.promptCtx&&G.promptCtx.from!=null?G.promptCtx.from:G.active;
 if(card.id==="marriage") ask("marriage",card.name,card.line,t,YESNO("Accept the alliance","Refuse"),{from:me,to:t});
 else if(card.id==="ransom") ask("ransom",card.name,card.line,t,YESNO("Pay 4 gold","Refuse"),{from:me,to:t});
 else if(card.id==="loan") ask("loan",card.name,card.line,t,YESNO("Lend 4 gold","Refuse"),{from:me,to:t});
 else if(card.id==="dowry"){
  /* the drawing realm names its price first */
  ask("dowryPrice",card.name,card.line,me,
   [2,3,4,5,6].map(n=>({id:String(n),label:n+" "+tr("gold")})),{from:me,to:t});}
 else if(card.id==="debt") ask("debt",card.name,card.line,t,
   [{id:"grain",label:"Give 3 grain"},{id:"gold",label:"Give 3 gold"},{id:"no",label:"Cannot settle"}],{from:me,to:t});
 else if(card.id==="road") ask("road",card.name,card.line,t,YESNO("Pay 2 gold","Do not"),{from:me,to:t});
 else if(card.id==="sanctuary") ask("sanctuary",card.name,card.line,t,YESNO("Grant sanctuary","Decline"),{from:me,to:t});}

function pickRival(){
 /* offers and shared fates are put to a person before another court */
 const rs=rivalSeats();
 const people=rs.filter(i=>!isBot(i));
 const pool=people.length?people:rs;
 let best=pool[0],bs=-1e9;
 pool.forEach(i=>{const r=G.players[i];const v=r.legacy*0.4-r.support*0.4;if(v>bs){bs=v;best=i;}});
 return best;}

function chooseAction(aid){
 const pl=P();
 if(aid==="build"&&(pl.projects.length>=workCap(pl.ruler)||pl.gold<deposit(pl)))return;  /* not a legal declaration */
 if(aid==="intrigue"&&pl.gold<intrigueCost(pl.ruler))return;
 G.court.action=aid;
 if(aid==="rally"){
  const pl2=P();
  G.court.great=false;
  if(pl2.ruler!=="zealot"&&pl2.lentBoon!=="zealot"&&pl2.ruler!=="architect"&&pl2.grain>=4){G.court.step="feast";return;}
  G.court.step="roll"; return;}
 if(aid==="build"){ if(!canBuildNow(P()))return; G.court.step="workpick";return;}
 if(aid==="intrigue"){
  const rs=rivalSeats();
  if(rs.length>1){G.court.step="targetseat";return;}
  G.court.targetSeat=rs[0];
  const o=G.players[rs[0]];
  G.court.step=(o.projects.some(w=>!w.delayed)||o.crises.length)?"target":"roll";
  if(G.court.step==="roll")G.court.target="court";
  return;}
 G.court.step="roll";}

function applyAction(){
 const p=P(),o=O(),die=G.court.die,aid=G.court.action,rid=p.ruler;let text="";
 if(aid==="harvest"){const g=Math.max(0,(rid==="steward"?die+2:rid==="merchant"?half(die):rid==="marshal"?die-2:die))+(kingly()?1:0)+(p.lentBoon==="steward"&&rid!=="steward"?2:0);p.flags.harvested=true;p.grain+=g;text=msg("gotGrain",{n:g});}
 else if(aid==="tax"){const g=Math.max(0,(rid==="merchant"?die+2:rid==="steward"?half(die):rid==="patron"?die-2:die))+(kingly()?1:0)+(p.lentBoon==="merchant"&&rid!=="merchant"?2:0);
  if(rid==="collector"||p.lentBoon==="collector")p.gold=Math.min(20,p.gold+g); else p.pendingGold+=g;
   p.support-=(rid==="collector"?2:1);p.flags.taxCount++;
   text=(rid==="collector")?msg("gotGoldNow",{n:g,s:2}):msg("gotGold",{n:g});}
 else if(aid==="rally"){const g=(rid==="zealot"||p.lentBoon==="zealot")?die:rid==="architect"?1:(G.court.great?die:half(die));p.support=Math.min(12,p.support+g);
  text=g?msg("gotSupport",{n:g}):msg("noSupport");}
 else if(aid==="intrigue"){p.gold-=intrigueCost(rid);p.flags.intrigue=true;
  let g=(rid==="spymaster"||p.lentBoon==="spymaster")?die:half(die);
  if(o.flags.mercenary){o.flags.mercenary=false;g=0;text=msg("mercBlocks");}
  if(o.projects.some(w=>w.effect==="ward"))g=half(g);
  if(!g)text=msg("plotFailed");
  else if(G.court.target==="works"&&o.projects.length){
   const w=o.projects.find(x=>String(x.key)===String(G.court.targetKey))||o.projects[0];
   if(w.delayed){text=msg("alreadyBack",{w:tr(w.name)});}
   else{w.due+=g;w.delayed=true;
    if(w.reward>1)w.reward-=1;                       /* the season is lost, and the glory with it */
    w.sabotaged=(w.sabotaged||0)+1;
    let bonus="";
    if(die===6){p.legacy+=1;p.ledger.brought+=1;bonus=" "+tr("The blow is spoken of. +1 legacy.");}
    text=msg("setBack",{w:tr(w.name),n:g})+" "+tr("It pays 1 less legacy now.")+bonus;}}
  else if(G.court.target==="debts"&&o.crises.length){
   const x=o.crises.find(y=>String(y.key)===String(G.court.targetKey))||o.crises[0];
   x.due=Math.max(o.turnsTaken,x.due-g);
   text=msg("broughtFwd",{c:tr(x.name),n:g,o:tr(o.name)});}
  else{o.support-=g;text=msg("lostSupport",{o:tr(o.name),n:g});
   if(o.support<=0)o.broughtDown=G.active;}
  if(G.truce&&((G.truce.a===G.active&&G.truce.b===G.court.targetSeat)||(G.truce.b===G.active&&G.truce.a===G.court.targetSeat))){
   p.legacy=Math.max(0,p.legacy-4); G.truce=null;
   text+=msg("truceBroken");}}
 G.court.used.push(aid);G.court.text=text;G.court.step="result";
 note("logAction",{p:p.name,a:ACTIONS.find(z=>z.id===aid).name,d:die,text:text});}

function drawWorks(){G.court.step="workpick";}

function keepWork(i){
 const p=P(),w=G.market[i];
 G.market.splice(i,1); refillMarket();
 const dep=deposit(p); p.gold-=dep; p.worksBegun++; p.flags.began=true;
 const reward=w.legacy+((p.ruler==="architect"||p.lentBoon==="architect")?2:0)-(p.ruler==="regent"?2:0);
 p.projects.push({name:w.name,cost:w.cost,reward,due:p.turnsTaken+w.turns,turns:w.turns,key:Math.random(),
  gain:w.gain||null,effect:w.effect||null,note:w.note||null});
 G.court.work=Object.assign({},w,{reward});G.court.used.push("build");
 G.court.text=msg("workBegun",{w:tr(w.name),n:dep,cost:cost(w.cost),t:w.turns,l:reward});
 G.court.step="result";note("logBegan",{p:p.name,w:w.name});}

function continueCourt(){
 G.court.done++;
 if(G.court.done>=2)toReckoning();
 else Object.assign(G.court,{step:"choose",action:null,target:null,targetKey:null,targetSeat:null,die:null,text:"",work:null,offerWorks:null});}

const canPay=o=>Object.entries(o||{}).every(([k,v])=>P()[k]>=v);
const findCrisis=key=>P().crises.find(c=>c.key==key)||G.pending.find(c=>c.key==key);

function settleNow(key,oi){
 const p=P(),item=findCrisis(key);if(!item)return;
 const opts=payOptions(item,p), o=opts[oi!==undefined?oi:0]; if(!o)return;
 if(o.forfeit){ if(!G.court||G.court.done>=2)return; G.court.done=2; note("logForfeit",{p:p.name,c:item.name}); }
 else Object.entries(o.cost).forEach(([k,v])=>{p[k]-=v;});
 const base=Math.max(1,half(item.penalty.legacy));
 const rw=p.ruler==="chronicler"?Math.max(0,base-1):base;
 p.legacy+=rw;p.ledger.settled+=rw;p.flags.settled++;
 if(item.loan&&G.players[item.lender]){                 /* the debt is paid to whoever lent it */
  const L=G.players[item.lender]; L.gold=Math.min(20,L.gold+6);
  note("logLoanRepaid",{p:p.name,o:L.name});}
 if(p.ruler==="patron"||p.lentBoon==="patron")p.support=Math.min(12,p.support+1);
 p.crises=p.crises.filter(c=>c.key!=key);G.pending=G.pending.filter(x=>x.key!=key);G.settling=null;
 if(rw)note("logSettled",{p:p.name,c:item.name,n:rw}); else note("logSettled0",{p:p.name,c:item.name});
 if(G.phase==="reckon"&&!G.pending.length)toCrown();}

/* the masons wait, and the work is remembered as a late one */
function stallWork(key){
 const p=P(),item=G.pending.find(x=>x.key==key);
 if(!item||item.kind!=="project")return;
 G.pending=G.pending.filter(x=>x!==item);     /* leaves the queue whatever else happens */
 const w=p.projects.find(x=>x.key==key)||item;
 w.due=p.turnsTaken+2;
 w.reward=Math.max(1,w.reward-2);
 w.late=(w.late||0)+1;
 note("logStall",{p:p.name,w:w.name,n:w.reward});
 if(!G.pending.length)G.phase="crown";}

function refuse(key){
 const p=P(),item=G.pending.find(x=>x.key==key);if(!item)return;
 if(item.kind==="project"){p.projects=p.projects.filter(x=>x.key!=key);note("logAbandon",{p:p.name,w:item.name});}
 else{
  let extra="";
  if(item.fam==="works"){
   const w=p.projects[0];
   if(!w) extra=" "+tr("No work stood to be harmed.");
   else if(item.eff==="back2"){w.due+=2;extra=" "+tr(w.name)+" set back 2 turns.";}
   else if(item.eff==="back3"){w.due+=3;extra=" "+tr(w.name)+" set back 3 turns.";}
   else if(item.eff==="rot"){w.cost=Object.assign({},w.cost,{gold:(w.cost.gold||0)+2});extra=" "+tr(w.name)+" costs 2 more gold.";}
   else if(item.eff==="abandon"){p.projects=p.projects.filter(x=>x.key!==w.key);extra=" "+tr(w.name)+" is abandoned.";}}
  if(item.fam==="reign"){
   if(item.eff==="banner"){p.extraDice=(p.extraDice||0)+1;extra=" One more die on the next crown roll.";}
   if(item.eff==="omen"){p.omen=true;extra=" The next six will end the reign, whoever wears the crown.";}
   if(item.eff==="council"){p.council=(p.council||0)+1;extra=" A die is added to every crown roll until it is settled.";}}
  const cut=((p.ruler==="bastard"||p.lentBoon==="bastard")&&!item.ownQuestion&&!item.loan)?1:0;   /* little is expected of him */
  const lost=Math.max(0,item.penalty.legacy-cut);
  p.legacy-=lost;p.ledger.refused+=lost;p.support-=item.penalty.support||0;
  p.flags.refused++;
  if(item.fam==="reign"&&item.eff==="council"){ const c2=p.crises.find(x=>x.key==key); if(c2)c2.due=p.turnsTaken+2; }
  else p.crises=p.crises.filter(c=>c.key!=key);
  note("logRefused",{p:p.name,c:item.name,extra:(item.penalty.legacy?msg("logRefusedL",{n:item.penalty.legacy}):"")+extra});}
 G.pending=G.pending.filter(x=>x.key!=key);
 if(G.phase==="reckon"&&!G.pending.length)toCrown();}

function testStakes(t,r){
 const m=r==="martyr"?2:0;
 return '<div class="sm" style="margin-top:2px"><span style="color:var(--forest)">'+tr("Kept")+': +'+(t.up+m)+' '+tr("legacy")+'</span>'+
  ' \u00b7 <span style="color:var(--crimson)">'+tr("Broken")+': \u2212'+(t.down+m)+' '+tr("legacy")+'</span>'+
  ' \u00b7 <span style="color:var(--inkSoft)">'+tr("void if cast out")+'</span></div>';}

const canBuildNow=p=>G.market.some(w=>w.turns<=turnsLeftFor(p));
const dueLabel=n=>n<=0?msg("dueNow"):n===1?msg("dueLast"):msg("dueIn",{n:n});

function workExtra(w){
 const bits=[];
 if(w.gain&&w.gain.support)bits.push("+"+w.gain.support+" "+tr("support"));
 if(w.effect==="respite")bits.push(tr("your next crisis arrives a turn later"));
 if(w.effect==="favour")bits.push(tr("a favour is owed to you"));
 if(w.effect==="ward")bits.push(tr("while it stands, Disrupts against you are halved"));
 return bits.length?' \u00b7 '+bits.join(' \u00b7 '):'';}

function completeWork(key){
 const p=P(),item=G.pending.find(x=>x.key==key);if(!item)return;
 Object.entries(finalCost(item,p.ruler)).forEach(([k,v])=>{p[k]-=v;});
 const rw=Math.max(0,item.reward+(kingly()?1:0)-(p.ruler==="almoner"?1:0)-(p.ruler==="diplomat"?1:0));
 p.legacy+=rw;p.ledger.works+=rw;p.flags.project=true;
 G.players.forEach((x,xi)=>{ if(xi!==G.active&&x.ruler==="almoner"){x.legacy+=1;x.ledger.boon+=1;} });
 let extra="";
 if(item.gain){Object.entries(item.gain).forEach(([k,v])=>{p[k]=(k==="support")?Math.min(12,p[k]+v):p[k]+v;});
  extra=" "+tr("Gained")+" "+cost(item.gain)+".";}
 if(item.effect==="respite"){p.respite=true;extra=" "+tr("The next crisis will come slower.");}
 if(item.effect==="favour"){const f=pick(FAVOUR_CARDS,1)[0];p.favours.push({id:f.id,key:Math.random(),born:p.turnsTaken});
  extra=" "+tr(f.name)+" "+tr("is owed to you.");}
 p.projects=p.projects.filter(x=>x.key!=key);G.pending=G.pending.filter(x=>x.key!=key);
 note("logDone",{p:p.name,w:item.name,n:rw,extra:extra});
 if(G.phase==="reckon"&&!G.pending.length)toCrown();}

const favourReady=(f,p)=>f.born===undefined||p.turnsTaken>f.born;
function spendFavour(key){
 const p=P(),f=p.favours.find(x=>x.key==key);if(!f)return;
 if(!favourReady(f,p))return;   /* granted this turn; it may be spent from the next */
 if(f.id==="reserve"){p.grain+=4;note("logReserve",{p:p.name});}
 else if(f.id==="audience"){ if(!G.court||G.court.done>=2)return; G.court.done-=1; note("logAudience",{p:p.name}); }
 else if(f.id==="astrologer"){ p.flags.astrologer=true; note("logAstro",{p:p.name}); }
 else if(f.id==="mercenary"){ p.flags.mercenary=true; note("logMerc",{p:p.name}); }
 else if(f.id==="chancellor"){ p.chancellor=p.ruler; note("logChanc",{p:p.name}); }
 else if(f.id==="scribe"){
  while(G.deck.length<3)G.deck=G.deck.concat(buildChronicle());
  G.scribing={key:f.key,cards:G.deck.slice(0,3),order:[]};
  if(isBot(G.active)){          /* a court keeps its gifts near and its debts far */
   const rank=c=>c.type==="crisis"?2:c.type==="quiet"?1:0;
   G.scribing.order=[0,1,2].sort((a,b)=>rank(G.scribing.cards[a])-rank(G.scribing.cards[b]));
   finishScribe();}
  return;}
 else if(f.id==="second"){
  const c=G.court;
  if(!c||c.step!=="result"||!c.snap)return;
  const snap=JSON.parse(c.snap);
  G.players=snap.players;
  while(G.log.length>snap.log)G.log.shift();
  G.players[G.active].favours=G.players[G.active].favours.filter(x=>x.key!=key);
  Object.assign(c,{step:"roll",die:null,text:"",snap:null});
  note("logSecond",{p:G.players[G.active].name});
  return;}
 else if(f.id==="name"){
  if(!nameUsable(p))return;
  G.offer.origTwo=G.offer.rulers.slice();
  G.offer.rulers=[...new Set(G.courtDeck)];
  G.offer.named=true;
  note("logName",{p:p.name});}
 else if(f.id==="envoy"){ return; }        /* the Envoy is sent from the answer panel, not spent here */
 else if(f.id==="guard"){p.support=Math.min(12,p.support+3);note("logGuard",{p:p.name});}
 else if(f.id==="pardon"){
  const open=p.crises.filter(c=>!c.loan);
  if(!open.length)return;
  if(open.length===1||isBot(G.active)){
   /* a court forgives the heaviest debt */
   const c=open.slice().sort((a,b)=>(b.penalty.legacy+(b.penalty.support||0))-(a.penalty.legacy+(a.penalty.support||0)))[0];
   pardonCrisis(c.key);}
  else { G.pardoning=f.key; return; }       /* ask which */
 }
 p.favours=p.favours.filter(x=>x.key!=key);
 if(G.phase==="reckon"&&!G.pending.length)toCrown();}

function pardonCrisis(key){
 const p=P(), c=p.crises.find(x=>x.key==key); if(!c)return;
 p.crises=p.crises.filter(x=>x.key!=key);
 G.pending=G.pending.filter(x=>x.key!=key);
 note("logPardon",{p:p.name,c:c.name});}

/* the scribe's three cards, back on the deck in the order chosen */
/* a favour held is only offered when this moment is the one it is for */
function favourLive(f,p){
 const mine=!isBot(G.active)&&G.players[G.active]===p;
 switch(f.id){
  case"second": return mine&&G.court&&G.court.step==="result"&&!!G.court.snap;
  case"name":   return mine&&nameUsable(p);
  case"envoy":  return false;                 /* sent from the answer panel */
  case"pardon": return p.crises.some(c=>!c.loan);
  case"audience":return !!(G.court&&G.court.done<2&&G.phase==="court");
 }
 return true;}

function finishScribe(){
 const sc=G.scribing; if(!sc)return;
 const ordered=sc.order.map(i=>sc.cards[i]);
 G.deck=ordered.concat(G.deck.slice(3));
 const p=P(); p.favours=p.favours.filter(x=>x.key!=sc.key);
 note("logScribe",{p:p.name});
 G.scribing=null;}

/* the chosen name only holds at a natural succession, and never while a Schemer rules */
function nameUsable(p){
 return G.phase==="succession"&&G.offer&&!G.offer.forced&&!G.offer.chosenRuler&&!G.offer.named&&
  !G.players.some(x=>x.ruler==="schemer");}

function toReckoning(){
 const p=P(),t=p.turnsTaken;
 G.pending=p.crises.filter(c=>c.due<=t).map(c=>Object.assign({kind:"crisis"},c))
  .concat(p.projects.filter(x=>x.due<=t).map(x=>Object.assign({kind:"project"},x)));
 if(G.pending.length)G.phase="reckon";else toCrown();}

function toCrown(){
 const p=P();
 if(p.ruler==="warlord"){p.support-=1;note("logWarlord",{p:p.name});}
 if(p.support<=0)supportSpent();else G.phase="crown";}

function applyCrown(){
 const p=P(),roll=(G.crownRoll&&G.crownRoll.length)?G.crownRoll:[d6()],read=[];
 G.crownRoll=roll;
 const ones=roll.filter(v=>v===1).length;
 const per=(p.ruler==="marshal"||p.lentBoon==="marshal")?0:(p.ruler==="ironqueen"?2:1);
 if(ones&&per){p.support-=ones*per;read.push(ones>1?msg("unrest",{n:ones,s:ones*per}):msg("unrest1",{s:ones*per}));}
 let fell=roll.indexOf(6)>-1;
 if(fell&&p.omen){p.omen=false;read.unshift(msg("omenHolds"));}
 else if(fell&&p.flags.astrologer){p.flags.astrologer=false;fell=false;read.unshift(msg("astroSaves"));}
 else if(fell&&(p.ruler==="ironqueen"||p.lentBoon==="ironqueen")&&!p.flags.sixSpared){
  p.flags.sixSpared=true;fell=false;read.unshift(msg("spared"));}
 G.crownRead=read;
 if(fell){read.unshift(msg("sixFalls"));note("logFalls",{p:p.name});endReign("fall");}
 else if(p.support<=0)supportSpent();
 else{G.phase="held";note("logHolds",{p:p.name,r:ruler(p.ruler).name});}}

function rollHeir(){}
function settleHeir(){
 const i=G.offer.heirDie<=3?0:1;
 G.offer.chosenRuler=G.offer.rulers[i];
 note("logCourtTop",{p:P().name,r:ruler(G.offer.chosenRuler).name});
 G.phase="succession";}

function chooseTestament(tid){
 const p=P(),chosen=G.offer.chosenRuler,other=(G.offer.origTwo||G.offer.rulers).find(r=>r!==chosen);
 const ci=G.courtDeck.indexOf(chosen); if(ci>-1)G.courtDeck.splice(ci,1);
 if(other){const oi=G.courtDeck.indexOf(other); if(oi>-1){G.courtDeck.splice(oi,1);G.courtDeck.push(other);}}
 G.courtDeck.push(p.ruler);            /* the dead ruler returns to the bottom of the court */
 if(G.courtDeck.length<3)G.courtDeck=G.courtDeck.concat(shuffle(buildCourt()));
 p.ruler=chosen;p.testament=tid;p.reignNo++;p.reignTurn=0;
 p.support=chosen==="usurper"?8:G.heirSupport;
 p.flags=newFlags();
 G.offer=null;G.lastTestament=null;G.succType=null;
 if(p.borrowFrom){p.ruler=p.borrowFrom;p.borrowFrom=null;}       /* safety, should never fire */
 if(p.chancellor){ p.borrowed=p.chancellor; p.chancellor=null; }
 if(p.ruler==="bastard")p.crises.push(questionCard(p));   /* the court asks by what right */
 note("logThrone",{p:p.name,r:ruler(p.ruler).name,n:p.support});
 if(G.beforeTheYear){          /* the fall came before the turn began; the heir still rules today */
  G.beforeTheYear=false;
  p.reignTurn=1;              /* this is the first turn of their reign, so they roll one die */
  G.crownRoll=null;G.crownRead=[];G.drawn=null;G.court=null;G.settling=null;
  G.phase="world"; return;}
 endTurn();}

/* one line describing any chronicle card, whatever family it belongs to */
/* the effect line, with the demand set in bold */
function effectRich(d,p){
 p=p||P();
 const B=x=>'<b>'+x+'</b>';
 if(d.type==="crisis"||d.fam){
  const opts=payOptions(d,p).filter(o=>!o.forfeit&&!o.neg).map(o=>B(o.label));
  const head=(d.fam==="act")?(B(tr("Forfeit an action"))+tr(" or ")+B(cost(d.demand))):opts.join(tr(" or "));
  return head+(d.showTurns===false?"":' <span style="opacity:.75">\u00b7 '+
    (ui.lang==="pt"?("em at\u00e9 "+d.turns+" turnos"):("within "+d.turns+" "+tr("turns")))+'</span>');}
 if(d.type==="boon")return Object.keys(d.gain||{}).length?(tr("Gain")+" "+B(cost(d.gain))):boldKeys(tr(d.line||""));
 if(d.type==="quiet")return '<span style="opacity:.75">'+tr("Nothing happens.")+'</span>';
 return boldKeys(tr(d.line||""));}

/* in prose rules, the figures and the first instruction carry the weight */
function boldKeys(txt){
 if(!txt)return "";
 let out=txt.replace(/(\d+\s+(?:gold|grain|support|legacy|ouro|gr\u00e3o|apoio|legado))/gi,"<b>$1</b>");
 if(out===txt){
  const m=txt.match(/^([^.;]+)([.;][\s\S]*)?$/);
  if(m)out="<b>"+m[1]+"</b>"+(m[2]||"");}
 return out;}

function describe(d,p){
 p=p||P();
 if(d.type==="crisis"||d.fam){
  const opts=payOptions(d,p).filter(o=>!o.forfeit&&!o.neg).map(o=>o.label);
  return d.fam==="act"
   ? msg("crisisAct",{cost:cost(d.demand),n:d.turns})
   : msg("crisisDue",{cost:opts.join(tr(" or ")),n:d.turns});}
 if(d.type==="boon")return Object.keys(d.gain||{}).length?("Gain "+cost(d.gain)):d.line;
 return tr(d.line)||"";}

function crisisEmb(c){
 if(c.fam==="works")return "hourglass";
 if(c.fam==="reign")return "crowd";
 const src=c.demand||(c.opts&&c.opts[0])||(c.res?{[c.res]:1}:{});
 const k=Object.keys(src);
 if(k.length>1)return "flame";
 if(k[0]==="grain")return "sheaf";
 if(k[0]==="gold")return "coin";
 if(k[0]==="support")return "crowd";
 return "hourglass";}
const workEmb=w=>w.turns<=2?"arch":w.turns===3?"tower":w.turns===4?"hall":"spire";
function chronEmb(d){
 return d.type==="crisis"?crisisEmb(d):d.type==="boon"?"sun":d.type==="favour"?"seal":
        d.type==="shared"?"crowd":d.type==="offer"?"coin":"quill";}

    h+='<div class="plate" style="border-color:'+s.main+';cursor:pointer" data-act="previewHeir" data-key="successor" data-tut="heirs" data-arg="'+rid+'">'+
     '<div style="display:flex;align-items:center;gap:8px">'+medallion(rid,s.main,40)+'<span class="serif" style="font-size:16px;color:'+s.main+'">'+tr(r.name)+'</span></div>'+
     '<div style="font-size:11px;color:var(--forest)">\u25b2 '+tr(r.boon)+'</div>'+
     '<div style="font-size:11px;color:var(--crimson)">\u25bc '+tr(r.ban)+'</div></div>';});
  }
  else if(G.offer.forced&&!G.offer.confirmed){
   const rid=G.offer.chosenRuler, hr=ruler(rid);
   h+='<div class="plate" style="border-color:'+s.main+';cursor:pointer" data-act="previewHeir" data-key="successor" data-tut="heirs" data-arg="'+rid+'">'+
    '<div style="display:flex;align-items:center;gap:8px">'+medallion(rid,s.main,40)+'<span class="serif" style="font-size:16px;color:'+s.main+'">'+tr(hr.name)+'</span></div>'+
    '<div style="font-size:11px;color:var(--forest)">\u25b2 '+tr(hr.boon)+'</div>'+
    '<div style="font-size:11px;color:var(--crimson)">\u25bc '+tr(hr.ban)+'</div></div>';}
  else{
   if(turnsLeftFor(p)<=2){
    h+='<div style="font-size:14px;margin-top:10px">'+tr("Too little of the age remains for a promise to be judged. None is made.")+'</div>'+
      '<button class="cta" style="background:'+s.main+'" data-act="chooseTestament" data-arg="none">'+tr("Take the throne")+'</button>';
    return h+'</div>';}
   h+='<div style="font-size:14px;margin-top:10px">'+msg("leaveTest",{r:tr(ruler(G.offer.chosenRuler).name)})+'</div>';
   h+=recapBlock();
   G.offer.testaments.forEach(tid=>{const t=testam(tid);
    h+='<button class="plate" style="border-color:var(--gold)" data-act="chooseTestament" data-key="testament" data-tut="testaments" data-arg="'+tid+'">'+
     '<div class="serif" style="font-size:16px;color:var(--gold)">'+tr(t.text)+'</div><div class="sm">'+tr(t.detail)+'</div>'+
     '<div style="font-size:10px;color:var(--inkSoft)">+'+t.up+' '+tr("honoured")+' \u00b7 \u2212'+t.down+' '+tr("broken")+'</div></button>';});}}

 return h+'</div>';}

/* ===================== CARD ART =====================
   A component kit, then a scene for each card. Woven, tonal, no faces. */
const IL="#4A4033", ILs="#6B5E4C";
const PAL={cream:"#F0E8D2",bone:"#E4DAC2",linen:"#D9CFB6",sage:"#A9B6A0",moss:"#6E8266",
 olive:"#8C8A5E",dry:"#B5A97E",umber:"#8E6F52",wood:"#6F5540",dark:"#584435",
 madder:"#A9645A",rose:"#C99189",gold:"#C9A85E",straw:"#DCC98A",
 sky:"#BDCAD6",water:"#8FA6B8",deep:"#6B8398",slate:"#6B7B8C",plum:"#9A7D96",
 stone:"#C2BAA6",shade:"#A79C86",snow:"#EDEAE0",flame:"#D9A14E",ash:"#7E7566"};
const P_=(d,f,w,c)=>'<path d="'+d+'" fill="'+(f||"none")+'" stroke="'+(c||IL)+'" stroke-width="'+(w===undefined?0.8:w)+'" stroke-linejoin="round" stroke-linecap="round"/>';
const F_=(d,f)=>'<path d="'+d+'" fill="'+f+'"/>';
const K_=(d,c,w)=>'<path d="'+d+'" fill="none" stroke="'+(c||ILs)+'" stroke-width="'+(w||0.5)+'" stroke-linecap="round"/>';
const O_=(x,y,rx,ry,f,w)=>'<ellipse cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'" fill="'+(f||"none")+'" stroke="'+IL+'" stroke-width="'+(w===undefined?0.8:w)+'"/>';

/* fine hatching, the way thread reads at a distance */
function hatch(x,y,w,h,c,step){
 step=step||2.2; let o='';
 for(let i=0;i<w+h;i+=step) o+=K_("M"+(x+Math.max(0,i-h))+" "+(y+Math.min(i,h))+" L"+(x+Math.min(i,w))+" "+(y+Math.max(0,i-w)),c||ILs,0.35);
 return '<g opacity=".4">'+o+'</g>';}

/* ---- terrain ---- */
const sky=c=>F_("M0 0 H100 V62 H0 Z",c||PAL.sky);
const ground=(y,c,c2)=>F_("M0 "+y+" H100 V62 H0 Z",c||PAL.olive)+
  K_("M0 "+(y+4)+" q26 -3 50 0 q24 3 50 -2",c2||PAL.dark,0.6)+
  K_("M0 "+(y+10)+" q30 -3 54 1 q20 3 46 -2",c2||PAL.dark,0.5);
const ridge=(y,c)=>P_("M0 "+y+" q18 -7 34 -2 q16 5 30 -4 q18 -6 36 2 V62 H0 Z",c||PAL.sage,0.7);
function waves(y,rows,c){let o='';for(let r=0;r<(rows||3);r++)for(let x=-4;x<104;x+=11)
 o+=K_("M"+x+" "+(y+r*5)+" q5.5 -3.4 11 0",c||PAL.deep,0.7);return o;}

/* ---- a figure: long, small-headed, no face ---- */
function fig(x,y,s,robe,opt){
 opt=opt||{}; s=s||1;
 const sh=opt.shade||PAL.dark;
 let o='<g transform="translate('+x+','+y+') scale('+s+')">';
 if(opt.cloak) o+=P_("M-6.4 19 q1.4 -12 6.4 -14 q5 2 6.4 14 Z",opt.cloak,0.7);
 o+=P_("M-4.6 19 q0.8 -11 4.6 -12.6 q3.8 1.6 4.6 12.6 Z",robe,0.7);
 o+=F_("M0 6.4 q3.8 1.6 4.6 12.6 L0 19 Z",sh)+'<g opacity=".22">'+F_("M0 6.4 q3.8 1.6 4.6 12.6 L0 19 Z",sh)+'</g>';
 o+=K_("M-2.4 11 q2.4 1.4 4.8 0 M-2.8 15 q2.8 1.6 5.6 0",ILs,0.4);
 o+=P_("M-1.6 6.2 q1.6 -1 3.2 0 l0.4 -3 h-4 Z","#DCCBB2",0.6);       /* neck */
 o+=O_(0,1.6,2.35,2.9,"#DCCBB2",0.7);                                  /* head, no features */
 if(opt.hood) o+=P_("M-2.9 2 q0.4 -4.4 2.9 -4.4 q2.5 0 2.9 4.4 q-2.9 -2.2 -5.8 0 Z",opt.hood,0.7);
 if(opt.hat)  o+=P_("M-3.4 0.2 h6.8 l-1 -2.6 h-4.8 Z",opt.hat,0.6);
 if(opt.halo) o+=O_(0,1.4,3.4,3.9,null,0.5);
 if(opt.staff)o+=K_("M5.6 -4 V19",PAL.wood,0.9);
 if(opt.kneel)o+=P_("M-5 19 q5 -3 10 0 Z",robe,0.6);
 return o+'</g>';}

/* ---- built things ---- */
function house(x,y,w,h,roof,body){
 const b=body||PAL.linen, r=roof||PAL.madder;
 return P_("M"+x+" "+y+" v-"+h+" h"+w+" v"+h+" Z",b,0.8)+
  F_("M"+(x+w*0.55)+" "+y+" v-"+h+" h"+(w*0.45)+" v"+h+" Z",PAL.shade)+
  '<g opacity=".3">'+F_("M"+(x+w*0.55)+" "+y+" v-"+h+" h"+(w*0.45)+" v"+h+" Z",PAL.dark)+'</g>'+
  P_("M"+(x-2)+" "+(y-h)+" L"+(x+w/2)+" "+(y-h-w*0.42)+" L"+(x+w+2)+" "+(y-h)+" Z",r,0.8)+
  K_("M"+(x+w/2)+" "+(y-h-w*0.42)+" L"+(x+w+2)+" "+(y-h),PAL.dark,0.5)+
  P_("M"+(x+w*0.36)+" "+y+" v-"+(h*0.55)+" a"+(w*0.14)+" "+(w*0.14)+" 0 0 1 "+(w*0.28)+" 0 v"+(h*0.55)+" Z",PAL.dark,0.6);}
function tower(x,y,w,h,roof){
 return P_("M"+x+" "+y+" v-"+h+" h"+w+" v"+h+" Z",PAL.linen,0.8)+
  F_("M"+(x+w*0.58)+" "+y+" v-"+h+" h"+(w*0.42)+" v"+h+" Z",PAL.shade)+
  P_("M"+(x-2.5)+" "+(y-h)+" L"+(x+w/2)+" "+(y-h-w*0.9)+" L"+(x+w+2.5)+" "+(y-h)+" Z",roof||PAL.madder,0.8)+
  P_("M"+(x+w*0.3)+" "+(y-h*0.55)+" a"+(w*0.2)+" "+(w*0.22)+" 0 0 1 "+(w*0.4)+" 0 v"+(h*0.3)+" h-"+(w*0.4)+" Z",PAL.slate,0.6);}
function wall(x,y,w,h){
 let o=P_("M"+x+" "+y+" v-"+h+" h"+w+" v"+h+" Z",PAL.stone,0.8);
 for(let i=x;i<x+w-1;i+=6) o+=P_("M"+i+" "+(y-h)+" v-3 h4 v3 Z",PAL.stone,0.6);
 for(let r=1;r<3;r++) o+=K_("M"+x+" "+(y-h+r*(h/3))+" H"+(x+w),PAL.shade,0.45);
 return o;}
function arch(x,y,w,h,f){
 return P_("M"+x+" "+y+" v-"+(h-w/2)+" a"+(w/2)+" "+(w/2)+" 0 0 1 "+w+" 0 v"+(h-w/2)+" Z",f||PAL.bone,0.8);}
function tree(x,y,s,c){

function sceneFor(d){
 if(d&&d.name&&WORK_SCENE[d.name])return WORK_SCENE[d.name];
 if(d&&d.name&&BY_NAME[d.name])return BY_NAME[d.name];
 if(d.type==="boon")return "sun";
 if(d.type==="favour")return "seal";
 if(d.type==="quiet")return "quill";
 if(d.type==="offer")return "offer";
 if(d.type==="shared")return "shared";
 if(d.type==="work"||d.kind==="project")return "work";
 if(d.fam==="works")return "masons";
 if(d.fam==="reign")return "pretender";
 if(d.fam==="pos")return "tithe";
 return "famine";}

function promptView(){
 if(!G||!G.prompt||G.cardUp||G.welcome||G.tutEnd)return "";
 const q=G.prompt, seat=SEAT[q.seat], me=G.players[q.seat];
 const envoy=me.favours.find(x=>x.id==="envoy"&&favourReady(x,me))&&G.promptCtx&&G.promptCtx.from!=null&&G.promptCtx.from!==q.seat&&!isBot(q.seat);
 const others=G.players.map((x,i)=>i).filter(i=>i!==q.seat&&i!==G.promptCtx.from);
 const envoyBtns=!envoy?"":('<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--gold)">'+
  '<div class="tiny" style="color:var(--gold);margin-bottom:4px">'+tr("The Envoy")+'</div>'+
  (others.length
   ? others.map(function(i){return '<button class="plate" data-act="sendEnvoy" data-arg="'+i+'" style="text-align:center;border-color:var(--gold)"><span class="sm">'+msg("sendTo",{o:tr(G.players[i].name)})+'</span></button>';}).join('')
   : '<button class="plate" data-act="sendEnvoy" data-arg="x" style="text-align:center;border-color:var(--gold)"><span class="sm">'+tr("decline it without cost")+'</span></button>')+
  '</div>');
 return '<div class="modal"><div class="box">'+
  '<div class="tiny" style="color:var(--plum)">'+msg("mustAnswer",{p:tr(me.name)})+'</div>'+
  (G.promptCtx&&G.promptCtx.from!=null&&G.promptCtx.from!==q.seat
    ? '<div class="sm" style="margin-top:3px">'+msg("putBy",{p:tr(G.players[G.promptCtx.from].name)})+'</div>':'')+
  '<div class="serif" style="font-size:21px;margin-top:5px">'+tr(q.name)+'</div>'+
  '<p>'+tr(q.line)+'</p>'+
  '<div class="sm" style="margin:-8px 0 12px">'+msg("youHold",{g:me.gold,r:me.grain,s:me.support})+'</div>'+
  q.opts.map(o=>{
   const note=OUTCOME_NOTE[q.cid]&&OUTCOME_NOTE[q.cid][o.id];
   return '<button class="cta" style="margin:0 0 9px;background:'+seat.main+';padding:12px 10px" data-act="answer" data-arg="'+o.id+'">'+
     '<div>'+tr(o.label)+'</div>'+
     (note?'<div style="font-size:12px;opacity:.85;font-weight:400;margin-top:3px">'+tr(note)+'</div>':'')+
     '</button>';}).join('')+
  envoyBtns+
  '</div></div>';}

/* a chronicle line matters to the recap only if legacy changed hands */
const legacyLine=l=>/legacy|legado/i.test(lineText(l));

function recapBlock(){
 if(!G.snap)return "";
 const lines=G.log.slice(0,Math.max(0,G.log.length-G.snap.mark)).filter(legacyLine);
 const moved=G.players.map((x,i)=>({n:x.name,d:x.legacy-(G.snap.legacy[i]||0),i}))
   .filter(o=>o.d!==0);
 if(!moved.length&&!lines.length)return "";
 let h='<div style="border:1px solid var(--edge);background:rgba(255,255,255,.4);border-radius:3px;padding:9px 11px;margin-top:10px">'+
  '<div class="tiny">'+tr("this turn")+'</div>';
 if(moved.length) h+='<div style="font-size:13px;margin:4px 0 6px">'+
   moved.map(o=>'<span style="color:'+SEAT[o.i].main+'">'+tr(o.n)+' '+(o.d>0?"+":"")+o.d+'</span>').join(' \u00b7 ')+'</div>';
 else h+='<div class="sm" style="margin:4px 0 6px">'+tr("No legacy changed hands.")+'</div>';
 h+=lines.slice(0,6).map(l=>'<div class="sm">'+lineText(l)+'</div>').join('');
 return h+'</div>';}

function msg(k,v){
 const e=MSG[k]; if(!e)return k;
 let s=e[(ui&&ui.lang==="pt")?"pt":"en"]||e.en;
 if(v)Object.keys(v).forEach(x=>{s=s.split("{"+x+"}").join(v[x]);});
 return s;}

function localise(){
 if(!ui||ui.lang!=="pt"||!app||!app.querySelectorAll)return;
 const w=document.createTreeWalker(app,NodeFilter.SHOW_TEXT,null);
 const ns=[]; while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{const k=n.nodeValue.trim(); if(k&&PT_DICT[k])n.nodeValue=n.nodeValue.replace(k,PT_DICT[k]);});}


/* ===================== THE TABLE ACROSS THE ROOM =====================
   One shared record per room. Only the realm whose turn it is writes to it;
   everyone else reads it every couple of seconds and redraws.            */
const BUILD="59.0";
const NET={on:false,room:null,seat:null,host:false,ver:0,seats:null,playing:null,poll:null,busy:false,listening:false,note:""};
const ROOMKEY=c=>"regnum:room:"+c;
let DB=null, DB_READY=false, DB_ERR="", DB_KIND="";

/* ---------------------------------------------------------------
   Two ways to reach the other players, behind one small surface:
   the Claude artifact store when the page runs inside claude.ai,
   or this page's own server when it is hosted anywhere else.
   Everything below the shim speaks the same three calls.
   --------------------------------------------------------------- */
function httpStore(){
 const api=async(path,opts)=>{
  const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"}},opts||{}));
  if(!r.ok)throw {code:"http_"+r.status,message:r.statusText};
  return r.json();};
 return {
  doc:function(path){ return {
    set:async function(data){
      const r=await fetch("/api/doc",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({path:path,data:data})});
      if(r.status===409){ const j=await r.json(); const e=new Error("stale"); e.code="stale"; e.current=j.current; throw e; }
      if(!r.ok)throw {code:"http_"+r.status};
    },
    get:async function(){
      const j=await api("/api/doc?path="+encodeURIComponent(path));
      return {exists:!!j.exists, data:function(){return j.data;}};},
    /* wait for the table to move past version v, up to half a minute */
    since:async function(v){
      const j=await api("/api/doc?path="+encodeURIComponent(path)+"&since="+v);
      return {exists:!!j.exists, data:function(){return j.data;}};}
  };},
  collection:function(name){
   const run=async function(limit){
    const j=await api("/api/list?prefix="+encodeURIComponent(name)+"&limit="+(limit||24));
    const docs=(j.docs||[]).map(function(d){return {id:d.id,data:function(){return d.data;}};});
    return {size:docs.length,docs:docs};};
   return {limit:function(n){ return {get:function(){ return run(n); }}; }, get:function(){ return run(24); }};
  }};}

(async()=>{
  try{
    if(typeof claude!=="undefined" && claude && typeof claude.use==="function"){
      DB=await claude.use("db");
      if(DB)DB_KIND="claude"; else DB_ERR="use(db) returned null";
    }
  }catch(e){ DB=null; DB_ERR=String((e&&e.code)||(e&&e.message)||e); }
  if(!DB){
    try{
      const r=await fetch("/api/ping");
      if(r.ok){ DB=httpStore(); DB_KIND="server"; DB_ERR=""; }
    }catch(e){ if(!DB_ERR)DB_ERR="no server on this origin"; }
  }
  DB_READY=true;
  if(typeof render==="function"&&typeof G!=="undefined")render(); })();
async function waitDB(ms){
 const t=Date.now();
 while(!DB_READY&&Date.now()-t<(ms||9000)) await new Promise(r=>setTimeout(r,120));
 return DB;}
const hasStore=()=>!!DB;
const roomCode=()=>{const L="BCDFGHJKLMNPQRSTVWXZ";let c="";for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c;};

function iMayAct(){
 if(!NET.on)return true;
 if(G&&G.prompt)return G.prompt.seat===NET.seat;
 if(!G)return NET.host;
 if(G.roundRecap)return true;                 /* anyone may dismiss the recap locally */
 if(isBot(G.active))return NET.host;          /* the courts are played by the host's device */
 return G.active===NET.seat;}

async function netWrite(){
 if(SEARCHING)return;
 if(!NET.on||!hasStore())return;
 NET.ver++;
 if(!DB)return;
 try{ await DB.doc("rooms/"+NET.room).set(
   {build:BUILD,v:NET.ver,seats:NET.seats,playing:NET.playing||null,g:G?JSON.parse(JSON.stringify(G)):null}); }
 catch(e){
  if(e&&e.code==="stale"&&e.current){        /* someone moved first: their table is the true one */
   const d=e.current;
   NET.ver=d.v; NET.seats=d.seats||NET.seats;
   if(d.g)G=d.g;
   NET.note=tr("Another realm moved first.");
   render();
   setTimeout(()=>{ if(NET.note===tr("Another realm moved first.")){NET.note="";render();} },2500);
   return;
  }
  NET.note=tr("The table could not be reached."); render(); }}

async function netRead(){
 if(!hasStore())return null;
 if(!DB)return null;
 try{ const snap=await DB.doc("rooms/"+NET.room).get(); return snap.exists?snap.data():null; }
 catch(e){ return null; }}

/* with our own server the table tells us the moment it changes */
async function netListen(){
 if(NET.listening)return;
 NET.listening=true;
 while(NET.on&&DB&&DB_KIND==="server"){
  try{
   const snap=await DB.doc("rooms/"+NET.room).since(NET.ver);
   if(!NET.on)break;
   const d=snap.exists?snap.data():null;
   if(d){
    if(d.playing&&!G&&d.g){ const ix=d.playing.indexOf(NET.seat); if(ix>=0)NET.seat=ix; }
    NET.seats=d.seats;
    if(d.v>NET.ver){ NET.ver=d.v; if(d.g)G=d.g; render(); }
    else if(!G) render();
   }
  }catch(e){ await new Promise(r=>setTimeout(r,1500)); }   /* a nap, a hiccup: try again shortly */
 }
 NET.listening=false;}

function netStart(){
 if(NET.poll)clearInterval(NET.poll);
 if(DB_KIND==="server"){ netListen(); return; }      /* our own server can hold the line */
 NET.poll=setInterval(async()=>{
  if(!NET.on||NET.busy)return;
  NET.busy=true;
  const d=await netRead();
  NET.busy=false;
  if(!d)return;
  if(d.playing&&!G&&d.g){                                 /* the table began: find my new seat */
   const ix=d.playing.indexOf(NET.seat);
   if(ix>=0)NET.seat=ix;
  }
  NET.seats=d.seats;
  if(d.v>NET.ver){ NET.ver=d.v; if(d.g)G=d.g; render(); }
  else if(!G) render();
 },2000);}

async function selfTest(){
 const out=[];
 const mark=(name,okv,extra)=>out.push({name,ok:okv,extra:extra||""});
 if(!DB_READY){ mark("shared store",false,"still connecting"); NET.diag=out; render(); return; }
 if(!DB){ mark("shared store",false,"unavailable in this view"); NET.diag=out; render(); return; }
 mark("shared store",true,"connected");
 try{ await DB.doc("rooms/_selftest").set({ping:1}); mark("write",true,"ok"); }
 catch(e){ mark("write",false,String((e&&e.code)||e.message||e)); }

async function findRooms(){
 NET.note=""; NET.finding=true; render();
 await waitDB();
 if(!(await storageWorks())){ NET.finding=false; NET.note="PREVIEW"; render(); return; }
 if(!hasStore()){NET.finding=false;NET.note=tr("Online play is not available here.");render();return;}
 try{
  const q=await DB.collection("rooms").limit(24).get();
  const out=[];
  q.docs.forEach(sn=>{
   if(sn.id.charAt(0)==="_")return;
   const d=sn.data()||{};
   out.push({code:sn.id,seated:((d.seats||[]).filter(x=>x&&x.taken).length),started:!!d.g});
  });
  NET.rooms=out.filter(x=>!x.started);
 }catch(e){ NET.note=tr("The table could not be reached."); }
 NET.finding=false; render();}

async function joinRoom(code){
 NET.note=tr("Reaching the table\u2026"); render();
 await waitDB();
 if(!(await storageWorks())){NET.note="PREVIEW";render();return;}
 NET.note="";
 NET.on=true; NET.host=false; NET.room=(code||"").toUpperCase().trim();
 let d=null, why="";
 try{ const snap=await DB.doc("rooms/"+NET.room).get();
      d=snap.exists?snap.data():null;
      if(!snap.exists)why=tr("no document at rooms/")+NET.room;
 }catch(e){ why=String((e&&e.code)||(e&&e.message)||e); }
 if(!d){
  let visible="?";
  try{ const q=await DB.collection("rooms").limit(24).get();
       visible=q.docs.filter(x=>x.id.charAt(0)!=="_").map(x=>x.id).join(", ")||tr("none");
  }catch(e){ visible=String((e&&e.code)||e.message||e); }
  NET.on=false;
  NET.note=tr("No table with that code.")+" ("+NET.room+") \u2014 "+why+" \u00b7 "+tr("tables you can see")+": "+visible;
  render(); return; }
 if(d.build&&d.build!==BUILD){
  NET.on=false;
  NET.note=tr("Different versions.")+" ("+tr("host")+" "+d.build+" \u00b7 "+tr("you")+" "+BUILD+") \u2014 "+
    tr("close this page and open the link again; a browser will keep serving the old copy.");
  render(); return; }
 NET.ver=d.v; NET.seats=d.seats||[{taken:true}]; G=d.g||null;
 if(G){ NET.on=false; NET.note=tr("That table has already begun."); render(); return; }
 /* take the first seat the host left open for a person */
 let free=-1;
 for(let k=0;k<NET.seats.length;k++){
   const st=NET.seats[k]||{};
   if((st.kind==="human"||st.kind===undefined)&&!st.taken){free=k;break;}
 }
 if(free<0){ NET.on=false; NET.note=tr("That table has no open seat."); render(); return; }
 NET.seat=free;
 NET.seats[free]={kind:"human",taken:true};
 await netWrite(); netStart(); render();}

function currentTut(){
 if(!G||G.over||NET.on||isBot(G.active)||G.welcome||G.tutEnd)return null;
 const p=P(); if(p.tutStep==null)p.tutStep=0;
 if(ui.tutDone){
  /* the guided turn is over, but a lesson that waits for its moment
     — a reckoning, a favour, an inherited promise — still gets one,
     for the first few turns of the real chronicle. */
  if(!ui.tutorial||p.turnsTaken>4)return null;
  if(!p.tutSeen)p.tutSeen={};
  for(const f of TUTOR_WHEN_SEEN){
   const id=f.id||f.k;
   if(!p.tutSeen[id]&&f.when(G))return (G.cardUp&&f.k!=="card")?null:f;
  }
  return null;
 }
 let i=p.tutStep;
 /* an optional step whose moment never came must not hold up the rest */
 while(i<TUTOR_STEPS.length&&TUTOR_STEPS[i].opt&&!TUTOR_STEPS[i].when(G)){
  let j=i+1,later=false;
  while(j<TUTOR_STEPS.length){ if(TUTOR_STEPS[j].when(G)){later=true;break;} j++; }
  if(!later)break;
  i++;
 }
 p.tutStep=i;
 let out=null;
 const st=TUTOR_STEPS[i];
 if(st&&st.when(G))out=st;
 else if(i>=5){           /* the basics are covered, so a waiting step may take its moment */
  if(!p.tutSeen)p.tutSeen={};
  for(const f of TUTOR_WHEN_SEEN){ const id=f.id||f.k; if(!p.tutSeen[id]&&f.when(G)){out=f;break;} }
 }
 /* nothing speaks over a card still being read */
 if(out&&G.cardUp&&out.k!=="card")return null;
 return out;}

function skipStep(st){            /* a step with nothing to point at is retired, not left blocking */
 const p=P();
 if(TUTOR_WHEN_SEEN.indexOf(st)>-1){ if(!p.tutSeen)p.tutSeen={}; p.tutSeen[(st.id||st.k)]=true; }
 else p.tutStep=(p.tutStep||0)+1;}

function clearTutor(){const old=document.getElementById("tutorLayer");if(old)old.remove();document.body.style.overflow="";}

function paintTutor(){
 clearTutor();
 const st=currentTut(); if(!st)return;
 const el=document.querySelector('[data-tut="'+((typeof st.anchor==="function"?st.anchor(G):st.anchor)||st.k)+'"]');
 if(!el||el.getBoundingClientRect().height<2){ skipStep(st); render(); return; }
 el.scrollIntoView({block:"center",inline:"nearest"});      /* settle first, measure after */
 requestAnimationFrame(()=>{
  const now=currentTut();
  if(!now||now!==st)return;
  const e2=document.querySelector('[data-tut="'+((typeof st.anchor==="function"?st.anchor(G):st.anchor)||st.k)+'"]');
  if(!e2){ skipStep(st); render(); return; }
  const r=e2.getBoundingClientRect();
  if(r.width<2||r.height<2){ skipStep(st); render(); return; }
