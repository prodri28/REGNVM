/* ===================== THE OPPOSING COURT ===================== */
/* One resource is worth roughly 0.7 legacy; one support roughly 0.8.
   Derived from the works curve, where ~1.4 resources buy 1 legacy.      */
const RES_VAL=0.7, SUP_VAL=0.8;
const RANK={steady:0,ruthless:1,king:2};
const TOPPLE_LEGACY=2;          /* legacy for bringing a rival to zero support with a Disrupt */
/* the King's court keeps a better treasury and a better yard: stated openly on the setup screen */
const kingly=i=>seatLevel(i===undefined?G.active:i)==="king";
const tier=i=>RANK[seatLevel(i===undefined?G.active:i)]||0;
const hard=()=>tier()>=1;
const crowned=()=>tier()>=2;
const noise=()=>!hard()&&Math.random()<0.35;

const totalCost=o=>Object.entries(o||{}).reduce((a,[k,v])=>a+v*(k==="support"?2:1),0);
const turnsLeftFor=p=>G.turns-p.turnsTaken;

/* what a ruler's actions actually yield, so the bot plans with its real hand */
function yieldOf(p,a){
 const r=p.ruler;
 if(a==="harvest")return r==="steward"?5.5:r==="merchant"?1.5:3.5;
 if(a==="tax")return r==="merchant"?5.5:r==="steward"?1.5:3.5;
 if(a==="rally")return r==="zealot"?3.5:r==="architect"?1:1.5;
 return 0;}

/* resources needed for everything landing within n turns */
function needsWithin(p,n){
 const need={gold:0,grain:0,support:0};
 p.crises.filter(c=>c.due<=p.turnsTaken+n).forEach(c=>{
  const d=effDemand(c,p);Object.entries(d).forEach(([k,v])=>{need[k]+=v;});});
 p.projects.filter(w=>w.due<=p.turnsTaken+n).forEach(w=>{
  Object.entries(finalCost(w,p.ruler)).forEach(([k,v])=>{need[k]+=v;});});
 return need;}

/* the worth of a realm, counted in legacy */
function evalRealm(p){
 let v=p.legacy;
 /* support matters enormously when scarce and very little when comfortable */
 const sv=p.support<=2?3.0:p.support<=4?1.25:p.support<=6?0.45:0.12;
 v+=Math.min(p.support,4)*1.25+Math.max(0,Math.min(p.support,7)-4)*0.45+Math.max(0,p.support-7)*0.12;
 v+=sv*0;                                     /* weights applied above */
 v+=(p.gold+p.pendingGold)*0.62+p.grain*0.28; /* gold buys works, and works are the score */
 p.projects.forEach(w=>{
  const c=finalCost(w,p.ruler);
  const need=(c.gold||0)+(c.grain||0)+(c.support||0);
  const have=(p.gold+p.pendingGold)+p.grain+p.support;
  const turns=Math.max(1,w.due-p.turnsTaken);
  v+=w.reward*(have>=need?0.8:Math.max(0.2,0.8-0.18*(need-have)/turns));});
 p.crises.forEach(cr=>{
  const ops=payOptions(cr,p).filter(o=>!o.forfeit);
  const can=ops.some(o=>Object.entries(o.cost).every(([k,x])=>p[k]>=x));
  const soon=Math.max(1,cr.due-p.turnsTaken);
  v-=(cr.penalty.legacy*(can?0.2:0.85)+(cr.penalty.support||0)*0.35)/Math.min(3,soon);});
 if(p.testament){const t=testam(p.testament);
  v+=checkT(p.testament,p)?t.up*0.45:-t.down*0.45;}
 return v;}

/* play the action out against three faces of the die, and keep the average */
function tryAction(a){
 const save=JSON.stringify(G), seat=G.active;
 const restore=()=>{const o=JSON.parse(save);
   Object.keys(G).forEach(k=>{delete G[k];}); Object.assign(G,o);};
 let total=0,n=0;
 SEARCHING=true;
 for(const face of [2,4,6]){
  try{
   restore();
   run("chooseAction",a);
   const c=()=>G.court;
   if(c()&&c().step==="feast")run("feast",P().grain>=6?"great":"modest");
   if(c()&&c().step==="workpick")run("keepWork",String(botWorkPick()));
   if(c()&&c().step==="targetseat")run("targetSeat",String(botTargetSeat()));
   if(c()&&c().step==="target")run("target","court");
   if(c()&&c().step==="roll"){FORCE_DIE=face;run("startRoll");FORCE_DIE=null;applyAction();}
   total+=evalRealm(G.players[seat]);n++;
  }catch(e){}
 }
 FORCE_DIE=null;SEARCHING=false;
 restore();
 return n?total/n:-1e9;}

/* a position is worth what you hold, less what your rivals hold */
function evalTable(seat){
 let mine=evalRealm(G.players[seat]), best=-1e9;
 G.players.forEach((x,i)=>{ if(i!==seat){const v=evalRealm(x); if(v>best)best=v;} });
 return mine-(best>-1e9?best*0.32:0);}

function botTargetSeat(){
 /* a court troubles a person before it troubles another court, always */
 const people=rivalSeats().filter(i=>!isBot(i));
 const pool=people.length?people:rivalSeats();
 let best=pool[0],bs=-1e9;
 pool.forEach(si=>{
  const r=G.players[si];
  let v=r.legacy*0.35-r.support*0.9+r.projects.length*1.2+r.crises.length*0.8;
  if(r.support<=4)v+=6;
  if(v>bs){bs=v;best=si;}});
 return best;}

function botAction(){
 const p=P(),o=O(),c=G.court,left=turnsLeftFor(p);
 const cap=workCap(p.ruler);
 const taxOpen=c.used.indexOf("tax")<0&&p.support>2;

 /* ---- The Steady Court: sound instincts, no arithmetic ---- */
 if(!hard()){
  if(p.support<=2)return "rally";
  if(Math.random()<0.25){
   const all=["harvest","rally","build","tax","intrigue"].filter(a=>
     (a!=="tax"||taxOpen)&&(a!=="build"||p.projects.length<cap)&&
     (a!=="intrigue"||p.gold>=intrigueCost(p.ruler)));
   return all[Math.floor(Math.random()*all.length)];}
  if(p.projects.length<cap&&p.gold>=deposit(p)+3&&(p.gold+p.grain)>=9)return "build";
  if(p.support<=4)return "rally";
  if(p.grain<=p.gold)return "harvest";
  if(taxOpen)return "tax";
  return "harvest";}

 /* ---- The King's Court: plays each action out before choosing ---- */
 if(crowned()){
  if(p.support<=2)return "rally";
  const legal=["harvest","rally","build","tax","intrigue"].filter(a=>
    (a!=="harvest"||p.grain<20)&&
    (a!=="rally"||p.support<12)&&
    (a!=="tax"||(taxOpen&&p.gold+p.pendingGold<20))&&
    (a!=="build"||(p.projects.length<cap&&p.gold>=deposit(p)&&canBuildNow(p)))&&
    (a!=="intrigue"||p.gold>=intrigueCost(p.ruler)));
  let pick=null,bv=-1e9;
  legal.forEach(a=>{const v=tryAction(a); if(v>bv){bv=v;pick=a;}});
  if(pick)return pick;
 }

 /* ---- The Ruthless Court: plans against what is coming ---- */
 const need=needsWithin(p,2);
 const shortGold=need.gold-(p.gold+p.pendingGold), shortGrain=need.grain-p.grain;

 if(p.support<=2&&p.ruler!=="architect")return "rally";
 if(p.support<=1)return "rally";
 if(shortGrain>0&&yieldOf(p,"harvest")>0)return "harvest";
 if(shortGold>0&&taxOpen)return "tax";
 if(left<=3){
  if(shortGrain>-2)return "harvest";
  if(taxOpen)return "tax";
  return "harvest";}
 if(p.projects.length<cap&&left>5&&p.support>3&&p.gold>=deposit(p)+4&&(p.gold+p.grain)>=8)return "build";
 if(p.support<=4)return "rally";
 const icost=intrigueCost(p.ruler);
 if(p.gold>=icost+3&&left>4){
  const hit=(p.ruler==="spymaster")?3.5:1.5;
  if(o.support<=hit)return "intrigue";     /* a blow that actually topples them */
  if(o.projects.length&&o.projects[0].due<=o.turnsTaken+2&&p.ruler==="warlord")return "intrigue";}
 if(p.grain<=p.gold&&yieldOf(p,"harvest")>=2)return "harvest";
 if(taxOpen&&yieldOf(p,"tax")>=2)return "tax";
 if(yieldOf(p,"harvest")>=2)return "harvest";
 return "rally";}

function botWorkPick(){
 const p=P(),left=turnsLeftFor(p),w=G.market;
 if(!hard()){let b=0;w.forEach((x,i)=>{if(x.legacy>w[b].legacy)b=i;});return b;}
 const score=x=>{
  const cst=totalCost(finalCost(x,p.ruler));
  let v=(x.legacy+(p.ruler==="architect"?2:0)-(p.ruler==="regent"?2:0))-cst*RES_VAL;
  if(x.turns>left)v-=99;                 /* will never mature */
  if(cst>p.gold+p.grain+x.turns*6)v-=4;  /* almost certainly unaffordable */
  return v;};
 let best=0; w.forEach((x,i)=>{if(score(x)>score(w[best]))best=i;}); return best;}

function botSettle(item){
 const p=P();
 if(item.kind==="crisis"){
  const ops=payOptions(item,p).filter(op=>(!op.forfeit||(G.court&&G.court.done<2))&&Object.entries(op.cost).every(([k,v])=>p[k]>=v));
  if(!ops.length)return "refuse";
  const spend=Math.min.apply(null,ops.map(op=>Object.entries(op.cost).reduce((a,[k,v])=>a+v*(k==="support"?SUP_VAL:RES_VAL),op.forfeit?2.4:0)));
  const avoided=item.penalty.legacy+(item.penalty.support||0)*SUP_VAL+Math.max(1,half(item.penalty.legacy))
   +((item.fam==="works"||item.fam==="reign")?3:0);
  return avoided>=spend?"pay":"refuse";}
 const cst=finalCost(item,p.ruler);
 const able=Object.entries(cst).every(([k,v])=>p[k]>=v);
 if(!able)return (item.reward>2&&turnsLeftFor(p)>3)?"stall":"refuse";
 if(item.kind==="project")return "pay";
 if(!hard())return "pay";
 const spend=Object.entries(cst).reduce((a,[k,v])=>a+v*(k==="support"?SUP_VAL:RES_VAL),0);
 const avoided=item.penalty.legacy+(item.penalty.support||0)*SUP_VAL
              +Math.max(1,half(item.penalty.legacy));
 return avoided>=spend?"pay":"refuse";}

function botHeir(){
 const p=P(),o=O(),left=turnsLeftFor(p);
 const inherited=p.crises.length, works=p.projects.length;
 const supDemand=p.crises.filter(c=>{const d=c.demand||(c.opts&&c.opts[0])||{};return d.support||c.res==="support";}).length;
 const sc={};
 G.offer.rulers.forEach(id=>{
  let v={merchant:5,steward:5,zealot:4,warlord:1,architect:6,diplomat:4,
         regent:3,chronicler:4,martyr:3,usurper:3,ironqueen:5,spymaster:3,
         collector:5,marshal:5,schemer:4,patron:4,bastard:3,almoner:4}[id];
  if(v===undefined)v=3;
  if(id==="architect")v+= (left>6?3:0)+works;
  if(id==="regent")v+=inherited*1.5;
  if(id==="diplomat")v+=supDemand*1.5+(p.support>6?2:0);
  if(id==="chronicler")v-=inherited;
  if(id==="usurper")v+=(G.heirSupport<=3?4:0)-(left<6?2:0);
  if(id==="warlord")v+=(o.support<=4?3:0)+(G.heirSupport>=6?2:0);
  if(id==="ironqueen")v+=2;
  if(id==="merchant")v+=(p.gold<p.grain?2:0);
  if(id==="steward")v+=(p.grain<p.gold?2:0);
  if(id==="martyr")v+=(works>0||p.crises.length===0?2:-1);
  if(left<=4)v+= (id==="architect"||id==="regent")?-2:0;
  sc[id]=v+(hard()?0:Math.random()*7);});
 const r=G.offer.rulers;
 return sc[r[0]]>=sc[r[1]]?r[0]:r[1];}

function botTestament(){
 const p=P(),heir=G.offer.chosenRuler;
 /* a court leaves the promise its heir can best afford to keep */
 const score=id=>{
  switch(id){
   case"provide":return p.crises.length>=2?7:3;
   case"endure": return heir==="ironqueen"?9:heir==="marshal"?6:3;
   case"treasury":return (p.gold>=5&&p.grain>=5)?7:2;
   case"notax":  return heir==="steward"?8:(heir==="merchant"||heir==="collector")?1:4;
   case"debts":  return p.crises.length<=1?6:2;
   case"nogreat":return (heir==="zealot"||heir==="architect")?9:5;
   case"noharv": return (heir==="merchant"||heir==="marshal")?8:heir==="steward"?1:4;
   case"nostone":return heir==="zealot"?6:heir==="architect"?1:4;
   case"hoard":  return p.gold>=8?7:3;
   case"fill":   return p.grain>=8?7:3;}
  return 3;};
 const t=G.offer.testaments;
 const jitter=hard()?0:6;
 const a=score(t[0])+Math.random()*jitter, b=score(t[1])+Math.random()*jitter;
 return a>=b?t[0]:t[1];}

/* what a promise forbids the court from doing */
function bound(p,aid){
 switch(p.testament){
  case"notax":  return aid==="tax";
  case"noharv": return aid==="harvest";
  case"nostone":return aid==="build";}
 return false;}

/* the court decides; the choice is shown, then taken */
function botDecide(){
 if(!isBot(G.active)||G.over)return null;
 const p=P(),c=G.court;
 switch(G.phase){
  case"handoff": return {act:"beginTurn"};
  case"world":{
   const sf=p.favours.find(f=>f.id==="scribe"&&favourReady(f,p));
   if(sf)return {act:"favour",arg:String(sf.key)};
   return {act:"drawChronicle"};}
  case"chronPick":{
   const val=x=>x.type==="crisis"?-(x.penalty.legacy):x.type==="boon"?3:x.type==="favour"?4:1;
   let bi=0;G.chronPick.forEach((c,i)=>{if(val(c)>val(G.chronPick[bi]))bi=i;});
   return {act:"chronKeep",arg:String(bi)};}
  case"court":
   if(c.step==="choose"){
    /* a favour costs no action, so spend a useful one first */
    const usable=p.favours.filter(f=>favourReady(f,p));
    for(const f of usable){
     if(f.id==="guard"&&p.support<=4)return {act:"favour",arg:String(f.key)};
     if(f.id==="reserve"&&p.grain<=3)return {act:"favour",arg:String(f.key)};
     if(f.id==="pardon"&&p.crises.some(x=>{
        const d=effDemand(x,p);
        return x.due<=p.turnsTaken+1 && !Object.entries(d).every(([k,v])=>p[k]>=v);}))
      return {act:"favour",arg:String(f.key)};
     if(f.id==="audience"&&c.done===0)return {act:"favour",arg:String(f.key)};
     if(f.id==="chancellor"&&p.reignTurn>=3)return {act:"favour",arg:String(f.key)};}
    if(G.marches&&p.gold>=6&&(hard()?temper(G.active)>=0:Math.random()<.4))return {act:"garrison"};
    /* every crisis still open at the end is charged in full, so clear what is affordable */
    const oldReign=crowned()&&(p.reignTurn+(p.extraDice||0)+(p.council||0))>=3;
    if(turnsLeftFor(p)<=2||oldReign){
     const closeable=p.crises.filter(x=>payOptions(x,p).some(op=>!op.forfeit&&Object.entries(op.cost).every(([k,v])=>p[k]>=v)));
     if(closeable.length){
      const it=closeable.sort((a,b)=>b.penalty.legacy-a.penalty.legacy)[0];
      const ops=payOptions(it,p);
      const oi=ops.findIndex(op=>!op.forfeit&&Object.entries(op.cost).every(([k,v])=>p[k]>=v));
      return {act:"settlePay",arg:String(it.key)+":"+oi};
     }
    }
    if(hard()&&p.reignTurn>=3){
     const easy=p.crises.filter(x=>{
      const d=effDemand(x,p);
      return Object.entries(d).every(([k,v])=>p[k]>=v+2);});
     if(easy.length&&Math.random()<0.5)return {act:"settlePay",arg:String(easy[0].key)+":0"};}
    let a=botAction();
    if(a==="tax"&&c.used.indexOf("tax")>-1)a="harvest";
    if(a==="build"&&(p.projects.length>=workCap(p.ruler)||p.gold<deposit(p)))a="harvest";
    if(a==="intrigue"&&p.gold<intrigueCost(p.ruler))a="rally";
    /* a bound court looks for the next best thing it is still allowed to do */
    const urgent=x=>{
      const soon=p.crises.filter(c=>c.due<=p.turnsTaken+1);
      const need=r=>soon.some(c=>{const d=c.demand||{};return (d[r]||0)>p[r];})||
        p.projects.some(w=>w.due<=p.turnsTaken+1&&((w.cost||{})[r]||0)>p[r]);
      return (x==="harvest"&&need("grain"))||(x==="tax"&&need("gold"));};
    const allowed=x=>!(bound(p,x)&&!urgent(x))&&!(x==="tax"&&c.used.indexOf("tax")>-1)&&
      !(x==="build"&&(p.projects.length>=workCap(p.ruler)||p.gold<deposit(p)||!canBuildNow(p)))&&
      !(x==="harvest"&&p.grain>=20)&&!(x==="rally"&&p.support>=12);
    if(!allowed(a)){ a=["rally","harvest","tax","build"].find(allowed)||"rally"; }
    return {act:"chooseAction",arg:a};}
   if(c.step==="feast"){
    const heavy=p.reignTurn+(p.extraDice||0)+(p.council||0);
    const want=crowned()
      ? (p.support<=6&&p.grain>=7)||(p.support<=4&&p.grain>=4)||(heavy>=3&&p.support<=7&&p.grain>=8)
      : (p.support<=4)||(p.reignTurn>=3&&p.support<=6);
    return {act:"feast",arg:(want&&p.testament!=="nogreat"&&p.grain>=(crowned()?4:6))?"great":"modest"};}
   if(c.step==="targetseat")return {act:"targetSeat",arg:String(botTargetSeat())};
   if(c.step==="target"){const o=O();
    if(o.support<=4)return {act:"target",arg:"court"};
    if(!o.projects.some(w=>!w.delayed)&&o.crises.length)return {act:"target",arg:"debts"};
    if(!o.projects.some(w=>!w.delayed)&&!o.crises.length)return {act:"target",arg:"court"};
    /* a debt they cannot yet meet is the cruellest target */
    const tight=o.crises.filter(x=>!Object.entries(effDemand(x,o)).every(([k,v])=>o[k]>=v));
    if(tight.length)return {act:"target",arg:"debts"};
    if(o.projects.length)return {act:"target",arg:"works"};
    return {act:"target",arg:"court"};}
   if(c.step==="targetcrisis"){const o=O();
    let best=o.crises[0];
    o.crises.forEach(x=>{if(x.penalty.legacy>best.penalty.legacy)best=x;});
    return {act:"targetCrisis",arg:String(best.key)};}
   if(c.step==="targetwork"){const o=O();
    const fresh=o.projects.filter(w=>!w.delayed);
    const pool=fresh.length?fresh:o.projects;
    let best=pool[0];
    pool.forEach(w=>{if(w.reward>best.reward)best=w;});
    return {act:"targetWork",arg:String(best.key)};}
   if(c.step==="roll")     return {act:"startRoll"};
   if(c.step==="workdraw") return {act:"drawWorks"};
   if(c.step==="workpick") return {act:"keepWork",arg:String(botWorkPick())};
   if(c.step==="result"){
    const so=p.favours.find(f=>f.id==="second"&&favourReady(f,p));
    if(so&&c.snap&&c.die<=2&&["harvest","tax","rally"].indexOf(c.action)>-1)return {act:"favour",arg:String(so.key)};
    return {act:"continueCourt"};}
   return null;
  case"reckon":{
   const it=G.pending[0];
   const m=botSettle(it);
   if(m==="stall")return {act:"stallWork",arg:String(it.key)};
   if(m==="pay"){
    if(it.kind!=="crisis")return {act:"completeWork",arg:String(it.key)};
    const ops=payOptions(it,p);
    let bi=-1,bc=1e9;
    ops.forEach(function(op,oi){
     if(op.forfeit&&!(G.court&&G.court.done<2))return;
     if(!Object.entries(op.cost).every(function(e){return p[e[0]]>=e[1];}))return;
     const c2=Object.entries(op.cost).reduce(function(a,e){return a+e[1]*(e[0]==="support"?SUP_VAL:RES_VAL);},op.forfeit?2.4:0);
     if(c2<bc){bc=c2;bi=oi;}});
    if(bi<0)return {act:"refuse",arg:String(it.key)};
    return {act:"settlePay",arg:String(it.key)+":"+bi};}
   return {act:"refuse",arg:String(it.key)};}
  case"crown": return {act:"startCrown"};
  case"held":  return {act:"endTurn"};
  case"succession":
   if(!G.offer.chosenRuler){
    const nf=p.favours.find(f=>f.id==="name"&&favourReady(f,p));
    if(nf&&nameUsable(p))return {act:"favour",arg:String(nf.key)};
    return {act:"chooseRuler",arg:botHeir()};}
   if(G.offer.forced&&!G.offer.confirmed)return {act:"confirmHeir"};
   if(turnsLeftFor(p)<=2)return {act:"chooseTestament",arg:"none"};
   return {act:"chooseTestament",arg:botTestament()};}
 return null;}

/* what the court is about to do, marked on the board */
function botHighlight(){
 if(!G||!G.botPick||!isBot(G.active))return "";
 const a=G.botPick.act, g=G.botPick.arg;
 const sel=(g===undefined||g===null)?'[data-act="'+a+'"]':'[data-act="'+a+'"][data-arg="'+g+'"]';
 return '<style>'+sel+'{background:#FBEEBB !important;border-color:#9C7A1C !important;'+
  'box-shadow:0 0 0 3px rgba(156,122,28,.4) !important;}'+
  sel+' .sm,'+sel+' .tiny{color:#6B5B44 !important;}</style>';}

const SPEEDS={slow:{label:"slow",mult:1.7},measured:{label:"measured",mult:1},brisk:{label:"brisk",mult:.62}};

function scheduleBot(){
 if(G&&(G.tut||G.welcome||G.tutEnd))return;   /* the walkthrough turn is played alone */
 if(botTimer){clearTimeout(botTimer);botTimer=null;}
 if(!G||G.over||!isBot(G.active)){if(G)G.botPick=null;return;}
 if(ui.paused||G.prompt||G.roundRecap)return;
 if(NET.on&&!NET.host)return;
 if(anim||G.phase==="crownRolling"||G.phase==="heirRolling")return;
 if(G.court&&G.court.step==="rolling")return;
 const m=SPEEDS[ui.speed].mult;
 if(G.botPick){                      /* the choice is on screen — now take it */
  const d=G.botPick;
  botTimer=setTimeout(()=>{botTimer=null;G.botPick=null;run(d.act,d.arg);},900*m);
 }else{                              /* think, then show what was chosen */
  botTimer=setTimeout(()=>{
   botTimer=null;
   const d=botDecide();
   if(!d)return;
   G.botPick=d;
   render();
  },(G.phase==="handoff"?1100:750)*m);}}

/* ===================== DISPATCH ===================== */
const NEEDS=key=>false;   /* the first-turn tutorials are retired — nothing intercepts an action */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
  const local=LOCAL_ACTS;
 const free=LOCAL_ACTS.concat(["setRivals","setOppAt","tutNext","tutSkip","welcomeGo","skipTutorial","tutorialOver"]);
 if(currentTut()&&el.dataset.act!=="tutNext"&&el.dataset.act!=="tutSkip")return;
 if(G&&G.cardUp&&el.dataset.act!=="cardSeen"&&["toggle","lang","pause","full","tutNext","tutSkip"].indexOf(el.dataset.act)<0){
  G.cardUp=null; render(); return;   /* never let an unseen card lock the board */
 }
 if(NET.on&&!iMayAct()&&local.indexOf(el.dataset.act)<0)return;
 if(G&&isBot(G.active)&&!G.over&&!G.prompt&&!G.roundRecap&&free.indexOf(el.dataset.act)<0)return;
 const act=el.dataset.act,arg=el.dataset.arg,key=el.dataset.key;

 run(act,arg);});

/* these change this screen only, never the shared game */
const LOCAL_ACTS=["toggle","cycleSpeed","pause","lang","full","host","find","joinRoom","selftest",
  "typeLetter","typeBack","typeJoin","setLen","setColour","seatKind","startOnline","closeRound","cardSeen"];

function run(act,arg){
 /* at a shared table, only the realm being waited on may move the game */
 const wasMine=iMayAct();                    /* judged BEFORE the move, since a move can pass the turn on */
 if(NET.on&&!wasMine&&LOCAL_ACTS.indexOf(act)<0)return;
 switch(act){
  case"setLen":ui.setup=arg;break;
  case"setRivals":ui.rivals=parseInt(arg,10);break;
  case"setColour":ui.colour=arg;break;
  case"setOppAt":{const q=arg.split(":");ui.opp[parseInt(q[0],10)]=q[1];break;}
  case"cycleSpeed":{const k=["slow","measured","brisk"];ui.speed=k[(k.indexOf(ui.speed)+1)%3];break;}
  case"pause":ui.paused=!ui.paused;break;
  case"lang":ui.lang=(ui.lang==="pt"?"en":"pt");break;
  case"host":hostRoom();return;
  case"find":findRooms();return;
  case"selftest":selfTest();return;
  case"typeLetter":{NET.typed=((NET.typed||"")+arg).slice(0,4);break;}
  case"typeBack":{NET.typed=(NET.typed||"").slice(0,-1);break;}
  case"typeJoin":{ if((NET.typed||"").length===4)joinRoom(NET.typed); return;}
  case"joinRoom":joinRoom(arg);return;
  case"seatKind":{                                        /* the host cycles one realm */
   if(!NET.host)break;
   const k=parseInt(arg,10);
   if(k===0)break;                                        /* the host always sits */
   (async()=>{
     await freshSeats();
     const st=NET.seats[k]||{};
     if(st.kind==="human"&&st.taken){ render(); return; } /* a seated guest stays */
     const cycle=[{kind:"human",taken:false},{kind:"court",level:"steady"},
                  {kind:"court",level:"ruthless"},{kind:"court",level:"king"},{kind:"closed"}];
     const cur=cycle.findIndex(c=>c.kind===st.kind&&(c.level||null)===(st.level||null));
     NET.seats[k]=cycle[(cur+1)%cycle.length];
     await netWrite(); render();
   })(); break;}
  case"startOnline":{
   if(!NET.host)break;
   (async()=>{
     await freshSeats();                                  /* the table as it really stands */
     const seats=[], mine=[];
     (NET.seats||[]).forEach((st,k)=>{
       if(!st||st.kind==="closed")return;
       if(st.kind==="court"){ seats.push(st.level||"ruthless"); mine.push(null); }
       else if(st.taken){ seats.push(null); mine.push(k); }
     });
     if(seats.length<2){ render(); return; }
     /* seats are re-numbered once the absent realms drop out */
     NET.seat=Math.max(0,mine.indexOf(NET.seat));
     NET.seats=seats.map((v,i)=>v?{kind:"court",level:v}:{kind:"human",taken:true});
     NET.playing=mine;                                    /* old seat -> new seat, for the guests */
     initGame(LENGTHS.find(l=>l.id===ui.setup).turns, seats);
     await netWrite(); render();
   })(); break;}
  case"full":{
   const d=document, el=d.documentElement;
   if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
   else{const f=el.requestFullscreen||el.webkitRequestFullscreen; if(f)f.call(el);}
   break;}
  case"closeRound":G.roundRecap=null;break;
  case"cardSeen":G.cardUp=null;break;
  case"tutNext":{const q=P(); const st=currentTut();
   if(st&&TUTOR_WHEN_SEEN.indexOf(st)>-1){ if(!q.tutSeen)q.tutSeen={}; q.tutSeen[(st.id||st.k)]=true; }
   else q.tutStep=(q.tutStep||0)+1;
   break;}
  case"tutSkip":{const q=P(); q.tutStep=99; q.tutSeen={lane:1,favours:1,testament:1}; break;}
  case"answer":answerPrompt(arg);break;
  case"start":{
   const seats=[null];
   for(let k=0;k<ui.rivals;k++)seats.push(ui.opp[k]==="human"?null:ui.opp[k]);
   const t=LENGTHS.find(l=>l.id===ui.setup).turns;
   if(ui.tutorial&&!ui.tutDone&&!NET.on){ initGame(t,seats,true); G.welcome=true; }
   else initGame(t,seats,false);
   break;}
  case"welcomeGo":G.welcome=false;break;
  case"skipTutorial":{ui.tutDone=true;const seats2=[null];
   for(let k=0;k<ui.rivals;k++)seats2.push(ui.opp[k]==="human"?null:ui.opp[k]);
   initGame(LENGTHS.find(l=>l.id===ui.setup).turns, seats2, false); break;}
  case"tutorialOver":{ui.tutDone=true;const seats3=[null];
   for(let k=0;k<ui.rivals;k++)seats3.push(ui.opp[k]==="human"?null:ui.opp[k]);
   initGame(LENGTHS.find(l=>l.id===ui.setup).turns, seats3, false); break;}
  case"restart":G=null;break;
  case"toggle":
   if(arg.indexOf("rival")===0){const si=parseInt(arg.slice(5),10); ui.rival=(ui.rival===si?null:si);}
   else ui[arg]=!ui[arg];
   break;
  case"modalOk":{const m=modal;modal=null;P().seen.push(m.key);run(m.act,m.arg);return;}
  case"beginTurn":beginTurn();break;
  case"drawChronicle":drawChronicle();break;
  case"chronKeep":G.skipCardUp=true;chronKeep(parseInt(arg,10));break;
  case"chronGive":{const gg=G.chronGive; if(gg)giveYear(parseInt(arg,10),gg.card,gg.kept); break;}
  case"chooseAction":chooseAction(arg);break;
  case"targetSeat":{G.court.targetSeat=parseInt(arg,10);
   const o=G.players[G.court.targetSeat];
   G.court.step=(o.projects.some(w=>!w.delayed)||o.crises.length)?"target":"roll";
   if(G.court.step==="roll")G.court.target="court";break;}
  case"feast":{G.court.great=(arg==="great"); if(G.court.great){P().grain-=4;P().flags.greatFeast=true;} G.court.step="roll"; break;}
  case"target":G.court.target=arg;G.court.step=(arg==="works"?"targetwork":arg==="debts"?"targetcrisis":"roll");break;
  case"targetWork":case"targetCrisis":G.court.targetKey=arg;G.court.step="roll";break;
  case"backToCourt":Object.assign(G.court,{step:"choose",action:null,target:null,targetKey:null,targetSeat:null});break;
  case"startRoll":G.court.snap=JSON.stringify({players:G.players,log:G.log.length});G.court.die=(FORCE_DIE||d6());G.court.step="rolling";break;
  case"drawWorks":drawWorks();break;
  case"keepWork":G.workPreview=null;keepWork(parseInt(arg,10));break;
  case"previewWork":if(G.court&&G.court.step==="workpick")G.workPreview=parseInt(arg,10);break;
  case"closeWork":G.workPreview=null;break;
  case"cancelBuild":                                  /* the masons are sent away; the day is not spent */
   if(G.court&&G.court.step==="workpick")
    Object.assign(G.court,{step:"choose",action:null,work:null,offerWorks:null});
   break;
  case"continueCourt":continueCourt();break;
  case"toggleSettle":G.settling=(G.settling==arg?null:arg);break;
  case"settlePay":{const q=String(arg).split(":");settleNow(q[0],q.length>1?parseInt(q[1],10):0);break;}
  case"stallWork":stallWork(arg);break;
  case"completeWork":completeWork(arg);break;
  case"refuse":refuse(arg);break;
  case"favour":spendFavour(arg);break;
  case"scribePick":{ const sc=G.scribing; if(!sc)break; const i=parseInt(arg,10);
   if(sc.order.indexOf(i)<0)sc.order.push(i);
   if(sc.order.length===3)finishScribe(); break;}
  case"scribeReset":if(G.scribing)G.scribing.order=[];break;
  case"sendEnvoy":{ const q=G.prompt, c=G.promptCtx; if(!q||!c)break;
   const me=q.seat, holder=G.players[me];
   const f=holder.favours.find(x=>x.id==="envoy"&&favourReady(x,holder)); if(!f)break;
   holder.favours=holder.favours.filter(x=>x.key!=f.key);
   const dest=parseInt(arg,10);
   if(isNaN(dest)){ G.prompt=null; G.promptCtx=null; note("logEnvoyDecline",{p:holder.name}); break; }
   note("logEnvoy",{p:holder.name,o:G.players[dest].name});
   q.seat=dest; c.to=dest; break;}
  case"pardonPick":{ const fk=G.pardoning; if(fk==null)break;
   pardonCrisis(arg);
   P().favours=P().favours.filter(x=>x.key!=fk); G.pardoning=null;
   if(G.phase==="reckon"&&!G.pending.length)toCrown(); break;}
  case"pardonCancel":G.pardoning=null;break;
  case"garrison":{const pp=P(); if(!G.marches||pp.gold<6)break;
   pp.gold-=6; pp.legacy+=3; pp.ledger.table+=3; G.marches=null;
   note("logGarrison",{p:pp.name});break;}
  case"startCrown":{const pp=P();
   const nd=Math.max(1,pp.reignTurn+(pp.extraDice||0)+(pp.council||0));
   pp.extraDice=0;
   G.crownRoll=Array.from({length:nd},d6);
   if(G.tut)G.crownRoll[0]=6;                    /* the tutorial reign always ends */
   G.phase="crownRolling";break;}
  case"endTurn":endTurn();break;
  case"chooseRuler":G.heirPreview=null;G.offer.chosenRuler=arg;break;
  case"rollHeir":rollHeir();break;
  case"confirmHeir":if(G.offer)G.offer.confirmed=true;G.heirPreview=null;break;
  case"previewHeir":if(G.phase==="succession")G.heirPreview=arg;break;
  case"closeHeir":G.heirPreview=null;break;
  case"chooseTestament":chooseTestament(arg==="none"?null:arg); if(G.tut){G.tutEnd=true;} break;}
 clampLegacy();
 if(G&&G.players)G.players.forEach(capAll);
 /* the throne does not wait for the crown roll */
 if(G&&!G.over&&["succession","handoff","crownRolling","chronPick"].indexOf(G.phase)<0&&P().support<=0){
  const pl=P();
  supportSpent();   /* handles the Warlord's burnout on its own */
 }
 render();
 if(NET.on&&G&&wasMine&&act!=="closeRound")netWrite();}

render();
</script>
